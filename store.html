                                <div class="carousel-controls" data-controls-for="${trackId}">
                                    <button class="carousel-nav-btn" data-scroll-target="${trackId}" data-dir="-1" aria-label="Anterior">
                                        <i data-lucide="chevron-left" size="16"></i>
                                    </button>
                                    <button class="carousel-nav-btn" data-scroll-target="${trackId}" data-dir="1" aria-label="Siguiente">
                                        <i data-lucide="chevron-right" size="16"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="carousel-track" id="${trackId}">
                                ${items.map(ext => renderStandardCard(ext)).join('')}
                            </div>
                        </section>
                    `;
                });
            }

            html += `</div>`;
            container.innerHTML = html;
            requestAnimationFrame(updateCarouselControlsVisibility);
        }

        /* =========================================================
           PÁGINA DE DETALLE ESTILO CHROME WEB STORE
           ========================================================= */
        function buildDetailSlides(ext) {
            const tags = ext.tags || [];
            return [
                {
                    type: 'art-overview',
                    label: 'Resumen',
                    icon: 'sparkles',
                    title: ext.name,
                    subtitle: ext.description || 'Extensión modular diseñada para ofrecer una experiencia fluida y minimalista.',
                    badge: ext.category || 'Extensión',
                    seed: ext.id || ext.name,
                    offset: 0
                },
                {
                    type: 'live-preview',
                    label: 'Interactivo',
                    icon: 'play',
                    seed: (ext.id || ext.name) + '-live',
                    offset: 1
                },
                {
                    type: 'art-specs',
                    label: 'Características',
                    icon: 'layers',
                    title: 'Integración Ligera y Rápida',
                    subtitle: tags.length > 0
                        ? `Optimizada para: ${tags.map(t => '#' + t).join(' · ')}`
                        : 'Sin dependencias pesadas. Ejecución aislada y segura en entorno oscuro.',
                    badge: `Versión ${ext.version || '1.0.0'}`,
                    seed: (ext.id || ext.name) + '-specs',
                    offset: 2
                }
            ];
        }

        function renderDetailPage(container) {
            const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);

            if (!ext) {
                container.innerHTML = `
                    <div class="view-section">
                        <div class="empty-state">
                            <i data-lucide="alert-circle" size="30" style="color: var(--text-muted);"></i>
                            <h3>Extensión no encontrada</h3>
                            <p>El enlace solicitado no corresponde a ninguna extensión disponible.</p>
                            <button class="btn-secondary" id="btn-back-home">Volver al catálogo</button>
                        </div>
                    </div>
                `;
                return;
            }

            const slug = appData.selectedExtensionId;
            const isInstalled = appData.installedIds.includes(slug);
            const safeIcon = resolveSafeIcon(ext.icon);
            const slides = buildDetailSlides(ext);
            const currentSlide = slides[appData.detailSlideIndex % slides.length];

            let stageHTML = '';
            let toolbarHTML = '';

            if (currentSlide.type === 'live-preview') {
                if (appData.previewLoading) {
                    stageHTML = `
                        <div class="stage-art-slide" style="background: #0c0c0e;">
                            <i data-lucide="loader" size="26" style="color: var(--text-muted);"></i>
                            <p style="font-size: 13.5px; color: var(--text-muted);">Cargando vista previa interactiva...</p>
                        </div>
                    `;
                } else if (appData.previewHtml) {
                    toolbarHTML = `
                        <div class="stage-toolbar">
                            <button class="stage-tool-btn" id="btn-reload-preview" title="Recargar vista previa">
                                <i data-lucide="rotate-cw" size="13"></i>
                                <span>Recargar</span>
                            </button>
                            <button class="stage-tool-btn" id="btn-toggle-fullscreen" title="Pantalla completa">
                                <i data-lucide="${appData.previewFullscreen ? 'minimize-2' : 'maximize-2'}" size="13"></i>
                                <span>${appData.previewFullscreen ? 'Salir' : 'Expandir'}</span>
                            </button>
                        </div>
                    `;
                    stageHTML = `<iframe id="extension-preview-iframe" title="Vista previa de ${escapeHTML(ext.name)}" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>`;
                } else {
                    const art = generateAbstractArt(currentSlide.seed, currentSlide.offset);
                    stageHTML = `
                        <div class="stage-art-slide" style="background: ${art.background};">
                            ${art.svg}
                            <div class="stage-card-mockup">
                                <i data-lucide="monitor" size="28" style="color: var(--text-main);"></i>
                                <h4>Vista Previa Interactiva</h4>
                                <p>Ejecuta una demostración funcional en vivo de <strong>${escapeHTML(ext.name)}</strong> dentro de un contenedor aislado.</p>
                                <button class="btn-primary" id="btn-trigger-live-preview" style="margin-top: 4px;">
                                    <i data-lucide="play" size="15"></i>
                                    <span>Iniciar demostración</span>
                                </button>
                            </div>
                        </div>
                    `;
                }
            } else {
                const art = generateAbstractArt(currentSlide.seed, currentSlide.offset);
                stageHTML = `
                    <div class="stage-art-slide" style="background: ${art.background};">
                        ${art.svg}
                        <div class="stage-card-mockup">
                            <span class="badge badge-accent">${escapeHTML(currentSlide.badge)}</span>
                            <div class="detail-icon-xl" style="width: 54px; height: 54px; border-radius: 16px;">
                                <i data-lucide="${safeIcon}" size="24"></i>
                            </div>
                            <h4>${escapeHTML(currentSlide.title)}</h4>
                            <p>${escapeHTML(currentSlide.subtitle)}</p>
                        </div>
                    </div>
                `;
            }

            const relatedList = appData.extensions.filter((item, idx) => getExtensionSlug(item, idx) !== slug);

            container.innerHTML = `
                <div class="view-section detail-page">
                    <div class="detail-topbar">
                        <div class="detail-breadcrumb">
                            <button id="btn-back-home">
                                <i data-lucide="arrow-left" size="15"></i>
                                <span>Volver</span>
                            </button>
                            <span>/</span>
                            <span>${escapeHTML(ext.category || 'General')}</span>
                        </div>

                        <button class="btn-secondary" id="btn-share-ext" style="padding: 7px 14px; font-size: 12.5px;">
                            <i data-lucide="share-2" size="14"></i>
                            <span>Compartir ficha</span>
                        </button>
                    </div>

                    <section class="detail-header-block">
                        <div class="detail-identity">
                            <div class="detail-icon-xl">
                                <i data-lucide="${safeIcon}" size="30" style="color: var(--text-main);"></i>
                            </div>
                            <div class="detail-title-area">
                                <h2>${escapeHTML(ext.name)}</h2>
                                <div class="detail-meta-inline">
                                    <span>Por <strong>${escapeHTML(ext.author || 'Comunidad')}</strong></span>
                                    <span>·</span>
                                    <span>${escapeHTML(ext.category || 'General')}</span>
                                </div>
                                <div class="detail-badges-row">
                                    ${ext.featured ? '<span class="badge badge-featured"><i data-lucide="award" size="12"></i> Destacada</span>' : ''}
                                    <span class="badge badge-neutral">v${escapeHTML(ext.version || '1.0.0')}</span>
                                    <span class="badge badge-neutral">${escapeHTML(ext.status || 'Estable')}</span>
                                    ${(ext.tags || []).map(t => `<span class="badge badge-neutral">#${escapeHTML(t)}</span>`).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="detail-cta-group">
                            <button class="btn-primary ${isInstalled ? 'installed-state' : ''}" id="btn-install-ext">
                                <i data-lucide="${isInstalled ? 'check' : 'download'}" size="16"></i>
                                <span>${isInstalled ? 'Obtenida' : 'Obtener'}</span>
                            </button>
                            <button class="btn-secondary" id="btn-source-ext">
                                <i data-lucide="code" size="16"></i>
                                <span>Código</span>
                            </button>
                        </div>
                    </section>

                    <section class="media-showcase-box">
                        <div class="media-stage ${appData.previewFullscreen ? 'fullscreen-stage' : ''}">
                            ${toolbarHTML}
                            ${!appData.previewFullscreen ? `
                                <button class="stage-nav-arrow prev" id="detail-slide-prev" aria-label="Anterior">
                                    <i data-lucide="chevron-left" size="18"></i>
                                </button>
                                <button class="stage-nav-arrow next" id="detail-slide-next" aria-label="Siguiente">
                                    <i data-lucide="chevron-right" size="18"></i>
                                </button>
                            ` : ''}
                            ${stageHTML}
                        </div>

                        <div class="media-thumbnails">
                            ${slides.map((s, idx) => {
                                const thumbArt = generateAbstractArt(s.seed, s.offset);
                                return `
                                    <button class="thumb-btn ${idx === appData.detailSlideIndex ? 'active' : ''}"
                                        data-detail-thumb="${idx}"
                                        style="background: ${thumbArt.background};">
                                        <span class="thumb-label">
                                            <i data-lucide="${s.icon}" size="11"></i>
                                            <span>${escapeHTML(s.label)}</span>
                                        </span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </section>

                    <section class="detail-section-block">
                        <h3>Descripción general</h3>
                        <p class="detail-desc-text">${escapeHTML(ext.description || 'Esta extensión no incluye una descripción detallada.')}</p>
                    </section>

                    <section class="detail-section-block">
                        <h3>Detalles</h3>
                        <div class="details-specs-grid">
                            <div class="spec-item">
                                <span>Versión</span>
                                <strong>${escapeHTML(ext.version || '1.0.0')}</strong>
                            </div>
                            <div class="spec-item">
                                <span>Desarrollador</span>
                                <strong>${escapeHTML(ext.author || 'Comunidad')}</strong>
                            </div>
                            <div class="spec-item">
                                <span>Estado</span>
                                <strong>${escapeHTML(ext.status || 'Estable')}</strong>
                            </div>
                            <div class="spec-item">
                                <span>Archivo fuente</span>
                                <strong>${escapeHTML(ext.file || 'N/A')}</strong>
                            </div>
                        </div>
                    </section>

                    <section class="detail-section-block">
                        <h3>${relatedList.length > 0 ? 'Relacionados' : 'Catálogo modular'}</h3>
                        ${relatedList.length > 0 ? `
                            <div class="carousel-track">
                                ${relatedList.map(item => renderStandardCard(item)).join('')}
                            </div>
                        ` : `
                            <div class="empty-state" style="padding: 28px 20px;">
                                <i data-lucide="blocks" size="24" style="color: var(--text-muted);"></i>
                                <p>Esta es actualmente la primera extensión disponible. Cuando añadas más módulos al repositorio, aparecerán aquí automáticamente.</p>
                            </div>
                        `}
                    </section>
                </div>
            `;

            if (currentSlide.type === 'live-preview' && appData.previewHtml && !appData.previewLoading) {
                const iframe = document.getElementById('extension-preview-iframe');
                if (iframe) iframe.srcdoc = appData.previewHtml;
            }
        }

        function renderApp() {
            renderTopNavigation();
            const mainContent = document.getElementById('main-content');
            if (appData.currentRoute === 'detail') {
                stopHeroTimer();
                renderDetailPage(mainContent);
            } else {
                renderCatalogView(mainContent);
                startHeroTimer();
            }
            lucide.createIcons();
        }

        async function fetchCatalog(manualSync = false) {
            const syncBtn = document.getElementById('btn-sync-catalog');
            if (manualSync && syncBtn) {
                syncBtn.querySelector('svg')?.style.setProperty('animation', 'spin 0.8s linear infinite');
            }
            try {
                const response = await fetch(BASE_URL + 'tools.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const payload = await response.json();
                const sorted = (payload.tools || []).slice().sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
                if (sorted.length > 0) {
                    appData.extensions = sorted;
                } else if (appData.extensions.length === 0) {
                    appData.extensions = FALLBACK_EXTENSIONS;
                }
                if (manualSync) showToast('Catálogo actualizado');
            } catch (e) {
                if (appData.extensions.length === 0) {
                    appData.extensions = FALLBACK_EXTENSIONS;
                }
                if (manualSync) showToast('Usando caché local', 'wifi-off');
            } finally {
                appData.isLoading = false;
                saveData();
                syncRouteFromHash();
                renderApp();
            }
        }

        function openInstallModal(ext) {
            const modal = document.getElementById('install-modal');
            const rawUrl = BASE_URL + (ext.file || '');
            document.getElementById('modal-ext-title').textContent = `Obtener ${ext.name}`;
            document.getElementById('modal-ext-desc').textContent = `Copia la URL directa del módulo para integrarlo en tu Homescreen o ábrelo directamente en una pestaña nueva.`;
            document.getElementById('modal-ext-url').textContent = rawUrl;
            document.getElementById('modal-open-file').href = rawUrl;
            modal.classList.add('open');
        }

        function closeInstallModal() {
            document.getElementById('install-modal').classList.remove('open');
        }

        function setupEventListeners() {
            window.addEventListener('resize', updateCarouselControlsVisibility);

            // Atajos de teclado: '/' o Ctrl+K para buscar, Esc para cerrar/limpiar
            document.addEventListener('keydown', e => {
                const searchInput = document.getElementById('search-input');
                const isInputFocused = document.activeElement === searchInput;

                if ((e.key === '/' && !isInputFocused) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
                    e.preventDefault();
                    searchInput.focus();
                    return;
                }

                if (e.key === 'Escape') {
                    const modal = document.getElementById('install-modal');
                    if (modal.classList.contains('open')) {
                        closeInstallModal();
                        return;
                    }
                    if (appData.previewFullscreen) {
                        appData.previewFullscreen = false;
                        renderApp();
                        return;
                    }
                    if (isInputFocused || appData.searchQuery) {
                        appData.searchQuery = '';
                        searchInput.value = '';
                        document.getElementById('search-clear').classList.remove('visible');
                        searchInput.blur();
                        renderApp();
                    }
                }
            });

            // Botón sincronizar catálogo
            document.getElementById('btn-sync-catalog').addEventListener('click', () => {
                fetchCatalog(true);
            });

            // Logo superior -> volver a Descubrir
            document.getElementById('brand-home-btn').addEventListener('click', () => {
                appData.searchQuery = '';
                document.getElementById('search-input').value = '';
                document.getElementById('search-clear').classList.remove('visible');
                appData.activeTab = 'Descubrir';
                navigateToCatalog(true);
            });

            // Pestañas de navegación superior
            document.getElementById('nav-tabs').addEventListener('click', e => {
                const tabBtn = e.target.closest('.nav-tab');
                if (!tabBtn) return;
                appData.activeTab = tabBtn.dataset.tab;
                appData.searchQuery = '';
                document.getElementById('search-input').value = '';
                document.getElementById('search-clear').classList.remove('visible');
                if (appData.currentRoute === 'detail') {
                    navigateToCatalog(true);
                } else {
                    renderApp();
                }
            });

            // Buscador superior
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');

            searchInput.addEventListener('input', e => {
                appData.searchQuery = e.target.value;
                searchClear.classList.toggle('visible', appData.searchQuery.length > 0);
                if (appData.currentRoute === 'detail') {
                    navigateToCatalog(false);
                } else {
                    renderApp();
                }
            });

            searchClear.addEventListener('click', () => {
                appData.searchQuery = '';
                searchInput.value = '';
                searchClear.classList.remove('visible');
                searchInput.focus();
                renderApp();
            });

            // Eventos del Modal
            document.getElementById('btn-close-modal').addEventListener('click', closeInstallModal);
            document.getElementById('install-modal').addEventListener('click', e => {
                if (e.target.id === 'install-modal') closeInstallModal();
            });

            document.getElementById('btn-copy-raw-url').addEventListener('click', () => {
                const url = document.getElementById('modal-ext-url').textContent;
                navigator.clipboard?.writeText(url);
                showToast('Enlace directo copiado al portapapeles');
            });

            document.getElementById('btn-confirm-install').addEventListener('click', () => {
                const slug = appData.selectedExtensionId;
                if (slug && !appData.installedIds.includes(slug)) {
                    appData.installedIds.push(slug);
                    saveData();
                }
                closeInstallModal();
                renderApp();
                showToast('Extensión marcada como obtenida');
            });

            // Delegación global en contenido principal
            document.getElementById('main-content').addEventListener('click', e => {
                // Controles del Hero Banner
                if (e.target.closest('#hero-prev')) {
                    const len = getHeroSlides().length;
                    appData.heroSlideIndex = (appData.heroSlideIndex - 1 + len) % len;
                    renderHeroOnly();
                    return;
                }
                if (e.target.closest('#hero-next')) {
                    const len = getHeroSlides().length;
                    appData.heroSlideIndex = (appData.heroSlideIndex + 1) % len;
                    renderHeroOnly();
                    return;
                }
                if (e.target.closest('#hero-pause')) {
                    appData.heroPaused = !appData.heroPaused;
                    renderHeroOnly();
                    if (appData.heroPaused) stopHeroTimer();
                    else startHeroTimer();
                    return;
                }

                const heroCta = e.target.closest('#hero-main-cta');
                if (heroCta) {
                    const action = heroCta.dataset.action;
                    if (action === 'open-ext' && heroCta.dataset.slug) {
                        navigateToExtension(heroCta.dataset.slug, true);
                    } else if (action === 'open-ext-preview' && heroCta.dataset.slug) {
                        navigateToExtension(heroCta.dataset.slug, true);
                        appData.detailSlideIndex = 1;
                        const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === heroCta.dataset.slug);
                        if (ext) loadInteractivePreview(ext);
                    } else {
                        appData.activeTab = 'Todas';
                        renderApp();
                    }
                    return;
                }

                // Tarjeta de categoría principal
                const catTile = e.target.closest('[data-select-tab]');
                if (catTile) {
                    appData.activeTab = catTile.dataset.selectTab;
                    renderApp();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }

                // Botones de carruseles horizontales
                const navBtn = e.target.closest('.carousel-nav-btn');
                if (navBtn) {
                    const track = document.getElementById(navBtn.dataset.scrollTarget);
                    if (track) {
                        track.scrollBy({ left: Number(navBtn.dataset.dir) * 320, behavior: 'smooth' });
                    }
                    return;
                }

                // Clic en cualquier tarjeta de extensión o tile del Hero
                const card = e.target.closest('[data-slug]');
                if (card && card.dataset.slug) {
                    navigateToExtension(card.dataset.slug, true);
                    return;
                }

                // Navegación dentro de la vista detalle
                if (e.target.closest('#btn-back-home')) {
                    navigateToCatalog(true);
                    return;
                }

                if (e.target.closest('#btn-share-ext')) {
                    navigator.clipboard?.writeText(window.location.href);
                    showToast('Enlace de la ficha copiado');
                    return;
                }

                if (e.target.closest('#detail-slide-prev')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (!ext) return;
                    const len = buildDetailSlides(ext).length;
                    appData.detailSlideIndex = (appData.detailSlideIndex - 1 + len) % len;
                    renderApp();
                    return;
                }

                if (e.target.closest('#detail-slide-next')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (!ext) return;
                    const len = buildDetailSlides(ext).length;
                    appData.detailSlideIndex = (appData.detailSlideIndex + 1) % len;
                    renderApp();
                    return;
                }

                const thumbBtn = e.target.closest('[data-detail-thumb]');
                if (thumbBtn) {
                    appData.detailSlideIndex = Number(thumbBtn.dataset.detailThumb);
                    renderApp();
                    return;
                }

                if (e.target.closest('#btn-trigger-live-preview')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (ext) loadInteractivePreview(ext);
                    return;
                }

                if (e.target.closest('#btn-reload-preview')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (ext) loadInteractivePreview(ext, true);
                    return;
                }

                if (e.target.closest('#btn-toggle-fullscreen')) {
                    appData.previewFullscreen = !appData.previewFullscreen;
                    renderApp();
                    return;
                }

                if (e.target.closest('#btn-install-ext')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (ext) openInstallModal(ext);
                    return;
                }

                if (e.target.closest('#btn-source-ext')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (ext && ext.file) {
                        window.open(BASE_URL + ext.file, '_blank', 'noopener');
                    }
                }
            });
        }

        window.onload = () => {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed.extensionsCache) && parsed.extensionsCache.length > 0) {
                        appData.extensions = parsed.extensionsCache;
                        appData.isLoading = false;
                    }
                    if (Array.isArray(parsed.installedIds)) {
                        appData.installedIds = parsed.installedIds;
                    }
                } else {
                    appData.extensions = FALLBACK_EXTENSIONS;
                }
            } catch (e) {
                appData.extensions = FALLBACK_EXTENSIONS;
            }

            syncRouteFromHash();
            setupEventListeners();
            renderApp();
            fetchCatalog();
        };
    </script>
</body>
</html>
