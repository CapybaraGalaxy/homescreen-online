<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tienda de Extensiones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Paleta Cromática Orgánica y Oscura */
            --bg: #000000;
            --surface: #111113;
            --surface-elevated: #18181b;
            --surface-hover: #1f1f24;
            
            /* Configuración Neo-Glass Pure */
            --glass: rgba(14, 14, 16, 0.72);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-strong: rgba(255, 255, 255, 0.16);
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.12);
            --blur-val: 30px;

            /* Jerarquía Textual */
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --text-subtle: #636366;

            /* Estados y Acentos de Sistema */
            --accent-blue: #0A84FF;
            --accent-purple: #BF5AF2;
            --accent-danger: #FF453A;
            --accent-success: #34C759;
            --accent-amber: #FF9F0A;

            /* Físicas de Animación Progresivas */
            --bezier: cubic-bezier(0.16, 1, 0.3, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Scrollbar minimalista */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.26);
        }

        button, input {
            font-family: 'Outfit', sans-serif;
            color: inherit;
            border: none;
            background: none;
            outline: none;
        }

        button {
            cursor: pointer;
        }

        /* =========================================================
           BARRA SUPERIOR PERSISTENTE ESTILO STORE
           ========================================================= */
        .top-navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            border-bottom: 1px solid var(--glass-border);
        }

        .navbar-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: calc(env(safe-area-inset-top) + 12px) 24px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .navbar-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-shrink: 0;
            user-select: none;
            transition: opacity 0.2s var(--bezier);
        }

        .brand-logo:hover {
            opacity: 0.9;
        }

        .app-icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--glass-border-strong);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), var(--glass-highlight);
            transition: transform 0.3s var(--spring);
        }

        .brand-logo:hover .app-icon-badge {
            transform: rotate(-4deg) scale(1.04);
        }

        .brand-title-wrap {
            display: flex;
            align-items: baseline;
            gap: 9px;
        }

        .brand-title-wrap h1 {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .header-counter {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            font-variant-numeric: tabular-nums;
        }

        /* Buscador Integrado con Atajo KBD */
        .search-bar-pill {
            flex: 1;
            max-width: 460px;
            height: 40px;
            border-radius: 100px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 12px 0 14px;
            gap: 10px;
            transition: border-color 0.25s var(--bezier), background 0.25s var(--bezier), box-shadow 0.25s var(--bezier);
        }

        .search-bar-pill:hover {
            border-color: rgba(255, 255, 255, 0.14);
        }

        .search-bar-pill:focus-within {
            background: var(--surface-elevated);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        .search-bar-pill input {
            width: 100%;
            font-size: 13.5px;
            color: var(--text-main);
        }

        .search-bar-pill input::placeholder {
            color: var(--text-muted);
        }

        .kbd-hint {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-subtle);
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .search-bar-pill:focus-within .kbd-hint {
            opacity: 0;
            display: none;
        }

        .search-clear-btn {
            display: none;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 50%;
            transition: color 0.2s, background 0.2s;
        }

        .search-clear-btn.visible {
            display: grid;
            place-items: center;
        }

        .search-clear-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .header-actions-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            padding: 0 14px;
            border-radius: 100px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: background 0.25s var(--bezier), color 0.25s var(--bezier), border-color 0.25s var(--bezier), transform 0.25s var(--spring);
        }

        .header-action:hover {
            background: var(--surface-hover);
            border-color: var(--glass-border-strong);
            color: var(--text-main);
        }

        .header-action:active {
            transform: scale(0.95);
        }

        .header-action.icon-only {
            width: 38px;
            padding: 0;
            justify-content: center;
        }

        @media (max-width: 680px) {
            .header-action span,
            .kbd-hint,
            .header-counter {
                display: none;
            }
            .header-action {
                width: 38px;
                padding: 0;
                justify-content: center;
            }
            .brand-title-wrap h1 {
                font-size: 17px;
            }
        }

        /* Pestañas Inferiores de la Barra Superior */
        .nav-tabs-row {
            display: flex;
            align-items: center;
            gap: 22px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-tabs-row::-webkit-scrollbar {
            display: none;
        }

        .nav-tab {
            position: relative;
            padding: 6px 2px 11px 2px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            transition: color 0.25s var(--bezier);
        }

        .nav-tab:hover {
            color: var(--text-main);
        }

        .nav-tab.active {
            color: var(--text-main);
            font-weight: 600;
        }

        .nav-tab.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2.5px;
            border-radius: 3px 3px 0 0;
            background: var(--text-main);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Contenedor Principal */
        .app-container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 24px 24px calc(env(safe-area-inset-bottom) + 56px) 24px;
        }

        .view-section {
            animation: viewEnter 0.4s var(--bezier) forwards;
        }

        @keyframes viewEnter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           HERO BANNER ESTILO CHROME WEB STORE (CON ARTE ABSTRACTO)
           ========================================================= */
        .hero-banner-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--glass-border-strong);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), var(--glass-highlight);
            margin-bottom: 36px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-slide {
            position: relative;
            padding: 38px 28px 56px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            z-index: 2;
            animation: slideFade 0.45s var(--bezier);
        }

        @keyframes slideFade {
            from { opacity: 0; transform: scale(0.985) translateY(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .hero-bg-art {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            transition: background 0.6s var(--bezier);
        }

        .hero-bg-art::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 70%);
        }

        .hero-bg-art svg {
            width: 100%;
            height: 100%;
            opacity: 0.34;
            mix-blend-mode: screen;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 13px;
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-main);
        }

        .hero-title {
            font-size: clamp(24px, 4vw, 35px);
            font-weight: 600;
            letter-spacing: -0.025em;
            max-width: 660px;
            line-height: 1.15;
        }

        .hero-subtitle {
            font-size: 14.5px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            max-width: 540px;
            line-height: 1.48;
        }

        /* Fila central de iconos flotantes estilo Chrome Web Store */
        .hero-icons-showcase {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 6px 0;
        }

        .hero-app-tile {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: rgba(16, 16, 19, 0.88);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            display: grid;
            place-items: center;
            color: var(--text-main);
            cursor: pointer;
            transition: transform 0.3s var(--spring), border-color 0.25s var(--bezier), box-shadow 0.3s var(--bezier);
        }

        .hero-app-tile:hover {
            transform: translateY(-5px) scale(1.07);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.75), 0 0 20px rgba(255, 255, 255, 0.12);
        }

        .hero-cta-btn {
            padding: 10px 22px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.24);
            color: var(--text-main);
            font-size: 13.5px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.25s var(--bezier), color 0.25s var(--bezier), transform 0.25s var(--spring);
        }

        .hero-cta-btn:hover {
            background: var(--text-main);
            color: var(--bg);
            transform: translateY(-1px);
        }

        .hero-cta-btn:active {
            transform: scale(0.97);
        }

        /* Controles inferiores derechos estilo Chrome Web Store (< 1/5 > ||) */
        .hero-controls {
            position: absolute;
            bottom: 16px;
            right: 20px;
            z-index: 4;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.56);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.88);
        }

        .hero-ctrl-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, 0.88);
            transition: background 0.2s, color 0.2s, transform 0.2s var(--spring);
        }

        .hero-ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        .hero-ctrl-btn:active {
            transform: scale(0.9);
        }

        /* =========================================================
           CATEGORÍAS PRINCIPALES Y SECCIONES DE CARRUSEL
           ========================================================= */
        .shelf-section {
            margin-bottom: 36px;
        }

        .shelf-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 12px;
        }

        .shelf-title-group {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .shelf-title {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.015em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .shelf-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 300;
        }

        .carousel-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.25s;
        }

        .carousel-controls.hidden-controls {
            display: none;
        }

        .carousel-nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            display: grid;
            place-items: center;
            color: var(--text-muted);
            transition: background 0.25s var(--bezier), color 0.25s var(--bezier), border-color 0.25s var(--bezier), transform 0.25s var(--spring);
        }

        .carousel-nav-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
            border-color: var(--glass-border-strong);
        }

        .carousel-nav-btn:active {
            transform: scale(0.92);
        }

        .carousel-track {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            padding: 2px 0 8px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        /* Tarjetas de Categorías Principales */
        .category-tile {
            scroll-snap-align: start;
            flex: 0 0 232px;
            height: 76px;
            border-radius: 18px;
            padding: 0 18px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-highlight);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s var(--spring), border-color 0.25s var(--bezier), box-shadow 0.3s var(--bezier);
        }

        .category-tile:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.26);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.55), var(--glass-highlight);
        }

        .category-tile:active {
            transform: scale(0.97);
        }

        .category-tile-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 1;
        }

        .category-tile-name {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-main);
        }

        .category-tile-count {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.68);
        }

        .category-tile-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.16);
            display: grid;
            place-items: center;
            color: var(--text-main);
            z-index: 1;
            flex-shrink: 0;
            transition: transform 0.3s var(--spring);
        }

        .category-tile:hover .category-tile-icon {
            transform: scale(1.08);
        }

        /* =========================================================
           TARJETAS DE EXTENSIÓN CON BANNER DE ARTE PROCEDURAL
           ========================================================= */
        .ext-card {
            scroll-snap-align: start;
            flex: 0 0 286px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-highlight);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.3s var(--bezier), border-color 0.3s var(--bezier), transform 0.3s var(--spring), box-shadow 0.3s var(--bezier);
        }

        .ext-card:hover {
            background: var(--surface-hover);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-3px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7), var(--glass-highlight);
        }

        .ext-card:active {
            transform: scale(0.985);
        }

        .card-cover {
            height: 116px;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .card-cover svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
            mix-blend-mode: screen;
            pointer-events: none;
            transition: transform 0.6s var(--bezier);
        }

        .ext-card:hover .card-cover svg {
            transform: scale(1.05);
        }

        .card-floating-icon {
            position: relative;
            z-index: 2;
            width: 46px;
            height: 46px;
            border-radius: 15px;
            background: rgba(14, 14, 17, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: grid;
            place-items: center;
            color: var(--text-main);
            transition: transform 0.3s var(--spring);
        }

        .ext-card:hover .card-floating-icon {
            transform: scale(1.06);
        }

        .card-badges-top {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* Sistema de Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.01em;
            backdrop-filter: blur(10px);
        }

        .badge-featured {
            background: rgba(52, 199, 89, 0.16);
            border: 1px solid rgba(52, 199, 89, 0.36);
            color: #63E683;
        }

        .badge-version {
            background: rgba(0, 0, 0, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.88);
            font-variant-numeric: tabular-nums;
        }

        .badge-neutral {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
        }

        .badge-accent {
            background: rgba(10, 132, 255, 0.16);
            border: 1px solid rgba(10, 132, 255, 0.36);
            color: #64B5F6;
        }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            gap: 14px;
        }

        .card-body h3 {
            font-size: 16.5px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 5px;
        }

        .card-body p {
            font-size: 13px;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.48;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-cta {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-main);
            font-weight: 500;
            transition: transform 0.3s var(--spring);
        }

        .ext-card:hover .card-cta {
            transform: translateX(3px);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .results-grid .ext-card {
            flex: initial;
            width: 100%;
        }

        /* =========================================================
           PÁGINA DE DETALLE ESTILO CHROME WEB STORE
           ========================================================= */
        .detail-page {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .detail-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .detail-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .detail-breadcrumb button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 100px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
        }

        .detail-breadcrumb button:hover {
            background: var(--surface-hover);
            border-color: var(--glass-border-strong);
        }

        .detail-header-block {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--glass-border);
        }

        @media (min-width: 740px) {
            .detail-header-block {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
            }
        }

        .detail-identity {
            display: flex;
            align-items: flex-start;
            gap: 18px;
        }

        .detail-icon-xl {
            width: 70px;
            height: 70px;
            border-radius: 21px;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--glass-border-strong);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65), var(--glass-highlight);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .detail-title-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-title-area h2 {
            font-size: clamp(22px, 3vw, 29px);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }

        .detail-meta-inline {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .detail-badges-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .detail-cta-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .btn-primary {
            padding: 11px 22px;
            border-radius: 100px;
            background: var(--text-main);
            color: var(--bg);
            font-size: 13.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.14);
            transition: transform 0.25s var(--spring), opacity 0.25s var(--bezier), background 0.25s;
        }

        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary.installed-state {
            background: rgba(52, 199, 89, 0.18);
            color: #63E683;
            border: 1px solid rgba(52, 199, 89, 0.4);
            box-shadow: none;
        }

        .btn-secondary {
            padding: 11px 18px;
            border-radius: 100px;
            background: var(--surface);
            border: 1px solid var(--glass-border-strong);
            color: var(--text-main);
            font-size: 13.5px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.25s var(--bezier), transform 0.25s var(--spring);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        /* Galería / Carrusel de Capturas Generadas + Vista Previa */
        .media-showcase-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .media-stage {
            position: relative;
            width: 100%;
            height: 390px;
            border-radius: 24px;
            border: 1px solid var(--glass-border-strong);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            background: var(--surface);
            transition: all 0.35s var(--bezier);
        }

        .media-stage.fullscreen-stage {
            position: fixed;
            inset: 16px;
            width: auto;
            height: auto;
            z-index: 120;
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.88), 0 24px 80px rgba(0, 0, 0, 0.9);
        }

        @media (max-width: 640px) {
            .media-stage {
                height: 310px;
            }
        }

        .stage-toolbar {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 6;
            display: flex;
            gap: 8px;
        }

        .stage-tool-btn {
            height: 32px;
            padding: 0 12px;
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.2s var(--spring);
        }

        .stage-tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .stage-art-slide {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
            gap: 14px;
            animation: slideFade 0.35s var(--bezier);
        }

        .stage-art-slide svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.38;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        .stage-card-mockup {
            position: relative;
            z-index: 2;
            max-width: 490px;
            width: 100%;
            padding: 26px;
            border-radius: 22px;
            background: rgba(12, 12, 15, 0.8);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), var(--glass-highlight);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .stage-card-mockup h4 {
            font-size: 18.5px;
            font-weight: 600;
        }

        .stage-card-mockup p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.52;
        }

        .media-stage iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000000;
        }

        .stage-nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            display: grid;
            place-items: center;
            transition: background 0.2s, transform 0.2s var(--spring);
        }

        .stage-nav-arrow:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .stage-nav-arrow.prev { left: 14px; }
        .stage-nav-arrow.next { right: 14px; }

        /* Miniaturas inferiores */
        .media-thumbnails {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0;
        }

        .thumb-btn {
            width: 92px;
            height: 54px;
            border-radius: 13px;
            border: 2px solid transparent;
            overflow: hidden;
            position: relative;
            background: var(--surface);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            opacity: 0.62;
            transition: opacity 0.25s, border-color 0.25s, transform 0.25s var(--spring);
        }

        .thumb-btn:hover {
            opacity: 0.92;
        }

        .thumb-btn.active {
            opacity: 1;
            border-color: var(--text-main);
            transform: translateY(-2px);
        }

        .thumb-label {
            position: relative;
            z-index: 2;
            font-size: 10.5px;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 3px 7px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Bloques de Información de Detalle */
        .detail-section-block {
            padding: 22px 0;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .detail-section-block:last-child {
            border-bottom: none;
        }

        .detail-section-block h3 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        .detail-desc-text {
            font-size: 14.5px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.84);
            line-height: 1.68;
            max-width: 780px;
        }

        .details-specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 680px) {
            .details-specs-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .spec-item {
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .spec-item span {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        .spec-item strong {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            word-break: break-word;
        }

        /* =========================================================
           MODAL DE INSTALACIÓN RÁPIDA Y TOAST FLOTANTE
           ========================================================= */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 150;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(12px);
            display: none;
            place-items: center;
            padding: 20px;
            animation: fadeIn 0.25s var(--bezier);
        }

        .modal-backdrop.open {
            display: grid;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-card {
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            background: #141417;
            border: 1px solid var(--glass-border-strong);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), var(--glass-highlight);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: modalPop 0.35s var(--spring);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            display: grid;
            place-items: center;
            color: var(--text-muted);
            transition: color 0.2s, background 0.2s;
        }

        .modal-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.14);
        }

        .url-copy-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 14px;
            background: #0a0a0c;
            border: 1px solid var(--glass-border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .url-copy-box span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: monospace;
        }

        .toast-notification {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 24px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 200;
            padding: 10px 18px;
            border-radius: 100px;
            background: rgba(24, 24, 28, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border-strong);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--bezier), transform 0.35s var(--spring);
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Estados Vacíos y Skeletons */
        .empty-state {
            padding: 64px 20px;
            text-align: center;
            background: var(--surface);
            border: 1px dashed var(--glass-border-strong);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .empty-state h3 {
            font-size: 17px;
            font-weight: 600;
        }

        .empty-state p {
            font-size: 13.5px;
            color: var(--text-muted);
            max-width: 380px;
            line-height: 1.5;
        }

        .skeleton-hero {
            height: 300px;
            border-radius: 28px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: translateX(-100%);
            animation: shimmer 1.4s infinite var(--bezier);
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <!-- Barra Superior Estilo Chrome Web Store -->
    <header class="top-navbar">
        <div class="navbar-inner">
            <div class="navbar-top-row">
                <div class="brand-logo" id="brand-home-btn" role="button" tabindex="0" aria-label="Ir a inicio">
                    <div class="app-icon-badge">
                        <i data-lucide="puzzle" size="19" style="color: var(--text-main);"></i>
                    </div>
                    <div class="brand-title-wrap">
                        <h1>Extensiones</h1>
                        <span class="header-counter" id="tools-counter"></span>
                    </div>
                </div>

                <div class="search-bar-pill">
                    <i data-lucide="search" size="16" style="color: var(--text-muted); flex-shrink: 0;"></i>
                    <input type="text" id="search-input" placeholder="Buscar extensiones, funciones o etiquetas...">
                    <span class="kbd-hint">/</span>
                    <button class="search-clear-btn" id="search-clear" aria-label="Limpiar búsqueda">
                        <i data-lucide="x" size="14"></i>
                    </button>
                </div>

                <div class="header-actions-right">
                    <button class="header-action icon-only" id="btn-sync-catalog" title="Sincronizar catálogo" aria-label="Sincronizar catálogo">
                        <i data-lucide="refresh-cw" size="15"></i>
                    </button>
                    <a class="header-action" href="https://github.com/CapybaraGalaxy/homescreen-online/tree/main/custom-tools" target="_blank" rel="noopener">
                        <i data-lucide="Code" size="15"></i>
                        <span>Repositorio</span>
                    </a>
                </div>
            </div>

            <nav class="nav-tabs-row" id="nav-tabs" aria-label="Navegación principal"></nav>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="app-container" id="main-content"></main>

    <!-- Modal de Obtención / Integración -->
    <div class="modal-backdrop" id="install-modal" role="dialog" aria-modal="true" aria-labelledby="modal-ext-title">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-ext-title">Obtener extensión</h3>
                <button class="modal-close" id="btn-close-modal" aria-label="Cerrar">
                    <i data-lucide="x" size="16"></i>
                </button>
            </div>
            <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.5;" id="modal-ext-desc">
                Copia el enlace directo del módulo para añadirlo a tu Homescreen o descarga el archivo fuente.
            </p>
            <div class="url-copy-box">
                <span id="modal-ext-url">https://...</span>
                <button class="btn-secondary" id="btn-copy-raw-url" style="padding: 6px 12px; font-size: 12px; flex-shrink: 0;">
                    <i data-lucide="copy" size="13"></i>
                    <span>Copiar</span>
                </button>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px;">
                <a class="btn-secondary" id="modal-open-file" href="#" target="_blank" rel="noopener" style="text-decoration: none;">
                    <i data-lucide="external-link" size="14"></i>
                    <span>Abrir archivo</span>
                </a>
                <button class="btn-primary" id="btn-confirm-install">
                    <i data-lucide="check" size="15"></i>
                    <span>Marcar obtenida</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Notificación Toast Flotante -->
    <div class="toast-notification" id="toast-msg" role="status" aria-live="polite"></div>

    <script>
        const BASE_URL = 'https://raw.githubusercontent.com/CapybaraGalaxy/homescreen-online/main/custom-tools/';
        const REPO_URL = 'https://github.com/CapybaraGalaxy/homescreen-online/tree/main/custom-tools';
        const STORAGE_KEY = 'neo_extensions_store_v4';

        const VALID_LUCIDE_ICONS = new Set([
            'flask-conical', 'wrench', 'calculator', 'clock', 'palette', 'box',
            'layers', 'terminal', 'compass', 'cpu', 'sliders', 'sparkles',
            'calendar', 'check-square', 'file-text', 'globe', 'music', 'camera',
            'puzzle', 'blocks', 'code', 'zap', 'shield', 'bar-chart-2', 'wand-2',
            'layout', 'grid', 'bookmark', 'eye', 'rocket'
        ]);

        const ART_PALETTES = [
            { bg: 'linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0f1015 100%)', stroke: '#38bdf8' },
            { bg: 'linear-gradient(135deg, #1a1025 0%, #2d1b4e 50%, #111015 100%)', stroke: '#c084fc' },
            { bg: 'linear-gradient(135deg, #0c2218 0%, #143d2b 50%, #0e1210 100%)', stroke: '#34d399' },
            { bg: 'linear-gradient(135deg, #271710 0%, #432315 50%, #14100e 100%)', stroke: '#fb923c' },
            { bg: 'linear-gradient(135deg, #121826 0%, #1e293b 50%, #0c0e14 100%)', stroke: '#818cf8' },
            { bg: 'linear-gradient(135deg, #23111c 0%, #3f182e 50%, #120d10 100%)', stroke: '#f472b6' }
        ];

        const FALLBACK_EXTENSIONS = [
            {
                id: 'fluid-ai',
                name: 'FluidAI',
                description: 'Asistente contextual integrado para agilizar consultas, redactar contenido y automatizar tareas rápidas directamente desde tu entorno.',
                category: 'Inteligencia Artificial',
                version: '1.0.0',
                author: 'Guilleplayer',
                icon: 'sparkles',
                tags: ['ia', 'productividad', 'asistente'],
                featured: true,
                status: 'Estable',
                file: 'fluidai.html',
                order: 1
            }
        ];

        let appData = {
            extensions: [],
            installedIds: [],
            activeTab: 'Descubrir',
            searchQuery: '',
            currentRoute: 'catalog',
            selectedExtensionId: null,
            heroSlideIndex: 0,
            heroPaused: false,
            detailSlideIndex: 0,
            previewFullscreen: false,
            previewHtml: '',
            previewLoading: false,
            isLoading: true
        };

        let heroInterval = null;
        let toastTimeout = null;

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    extensionsCache: appData.extensions,
                    installedIds: appData.installedIds
                }));
            } catch (e) {}
        }

        function showToast(message, iconName = 'check-circle-2') {
            const toast = document.getElementById('toast-msg');
            toast.innerHTML = `<i data-lucide="${iconName}" size="15" style="color: var(--accent-success);"></i><span>${escapeHTML(message)}</span>`;
            lucide.createIcons({ root: toast });
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);
        }

        function escapeHTML(str) {
            return String(str ?? '').replace(/[&<>"']/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match]));
        }

        function resolveSafeIcon(iconName) {
            if (!iconName || typeof iconName !== 'string') return 'puzzle';
            const clean = iconName.trim().toLowerCase();
            return VALID_LUCIDE_ICONS.has(clean) ? clean : 'puzzle';
        }

        function getExtensionSlug(ext, idx) {
            return String(ext.id || ext.file || ext.name || idx)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        /* =========================================================
           GENERADOR DE ARTE ABSTRACTO Y DEGRADADOS (SIN FOTOS)
           ========================================================= */
        function generateAbstractArt(seedText, variantOffset = 0) {
            const hash = hashString(String(seedText || 'neo')) + variantOffset;
            const palette = ART_PALETTES[hash % ART_PALETTES.length];
            const patternType = hash % 4;
            const c = palette.stroke;

            let svgPattern = '';
            if (patternType === 0) {
                svgPattern = `
                    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="p-${hash}" width="80" height="80" patternUnits="userSpaceOnUse">
                                <rect x="4" y="4" width="34" height="34" rx="10" fill="none" stroke="${c}" stroke-width="1.2" stroke-opacity="0.45"/>
                                <rect x="42" y="42" width="34" height="34" rx="10" fill="${c}" fill-opacity="0.08" stroke="${c}" stroke-width="1.2" stroke-opacity="0.35"/>
                                <circle cx="59" cy="21" r="10" fill="none" stroke="${c}" stroke-width="1.2" stroke-opacity="0.35"/>
                                <circle cx="21" cy="59" r="6" fill="${c}" fill-opacity="0.25"/>
                            </pattern>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#p-${hash})"/>
                    </svg>
                `;
            } else if (patternType === 1) {
                svgPattern = `
                    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                        <g fill="none" stroke="${c}" stroke-width="1.3">
                            <circle cx="320" cy="40" r="65" stroke-opacity="0.35"/>
                            <circle cx="320" cy="40" r="105" stroke-opacity="0.25"/>
                            <circle cx="320" cy="40" r="145" stroke-opacity="0.15"/>
                            <path d="M-20 160 Q 110 90, 220 150 T 430 120" stroke-opacity="0.4"/>
                            <path d="M-20 185 Q 110 115, 220 175 T 430 145" stroke-opacity="0.22"/>
                        </g>
                    </svg>
                `;
            } else if (patternType === 2) {
                svgPattern = `
                    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="g-${hash}" width="48" height="48" patternUnits="userSpaceOnUse">
                                <path d="M 48 0 L 0 0 0 48" fill="none" stroke="${c}" stroke-width="1" stroke-opacity="0.25"/>
                                <circle cx="0" cy="0" r="2.2" fill="${c}" fill-opacity="0.5"/>
                            </pattern>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#g-${hash})"/>
                        <circle cx="290" cy="100" r="70" fill="${c}" fill-opacity="0.12"/>
                    </svg>
                `;
            } else {
                svgPattern = `
                    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                        <g fill="none" stroke="${c}" stroke-width="1.2">
                            <ellipse cx="200" cy="100" rx="150" ry="52" transform="rotate(-14 200 100)" stroke-opacity="0.35"/>
                            <ellipse cx="200" cy="100" rx="150" ry="52" transform="rotate(14 200 100)" stroke-opacity="0.22"/>
                            <circle cx="95" cy="72" r="5" fill="${c}" fill-opacity="0.55"/>
                            <circle cx="305" cy="128" r="7" fill="${c}" fill-opacity="0.35"/>
                        </g>
                    </svg>
                `;
            }

            return {
                background: palette.bg,
                svg: svgPattern
            };
        }

        function getCategoryIcon(categoryName) {
            const cat = (categoryName || '').toLowerCase();
            if (cat.includes('ia') || cat.includes('inteligencia')) return 'sparkles';
            if (cat.includes('util')) return 'wrench';
            if (cat.includes('prod')) return 'clock';
            if (cat.includes('diseñ')) return 'palette';
            if (cat.includes('desarr') || cat.includes('dev')) return 'code';
            return 'layers';
        }

        /* =========================================================
           NAVEGACIÓN Y RUTAS
           ========================================================= */
        function navigateToExtension(slug, pushHistory = true) {
            const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === slug);
            if (!ext) {
                navigateToCatalog(false);
                return;
            }
            appData.currentRoute = 'detail';
            appData.selectedExtensionId = slug;
            appData.detailSlideIndex = 0;
            appData.previewFullscreen = false;
            appData.previewHtml = '';
            appData.previewLoading = false;

            if (pushHistory) {
                window.history.pushState({ route: 'detail', slug }, '', '#extension/' + encodeURIComponent(slug));
            }
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateToCatalog(pushHistory = true) {
            appData.currentRoute = 'catalog';
            appData.selectedExtensionId = null;
            appData.previewFullscreen = false;
            appData.previewHtml = '';
            appData.previewLoading = false;

            if (pushHistory) {
                window.history.pushState({ route: 'catalog' }, '', window.location.pathname + window.location.search);
            }
            renderApp();
        }

        window.addEventListener('popstate', () => {
            syncRouteFromHash();
            renderApp();
        });

        function syncRouteFromHash() {
            const hash = window.location.hash || '';
            if (hash.startsWith('#extension/')) {
                const slug = decodeURIComponent(hash.slice('#extension/'.length));
                const exists = appData.extensions.some((item, idx) => getExtensionSlug(item, idx) === slug);
                if (exists) {
                    appData.currentRoute = 'detail';
                    appData.selectedExtensionId = slug;
                    return;
                }
            }
            appData.currentRoute = 'catalog';
            appData.selectedExtensionId = null;
        }

        function loadInteractivePreview(ext, forceReload = false) {
            if (!ext || !ext.file || appData.previewLoading) return;
            if (forceReload) appData.previewHtml = '';
            appData.previewLoading = true;
            renderApp();

            fetch(BASE_URL + ext.file, { cache: 'no-store' })
                .then(res => {
                    if (!res.ok) throw new Error('Error de red');
                    return res.text();
                })
                .then(html => {
                    appData.previewHtml = html;
                    appData.previewLoading = false;
                    renderApp();
                })
                .catch(() => {
                    appData.previewHtml = '<div style="display:grid;place-items:center;height:100%;background:#0a0a0c;color:#8E8E93;font-family:sans-serif;font-size:13px;padding:24px;text-align:center;">No se pudo cargar la vista previa remota. Puedes abrir el archivo fuente desde el botón superior.</div>';
                    appData.previewLoading = false;
                    renderApp();
                });
        }

        /* =========================================================
           HERO BANNER SLIDES
           ========================================================= */
        function getHeroSlides() {
            const exts = appData.extensions;
            const slides = [];

            slides.push({
                eyebrow: exts.length === 1 ? 'Destacada · v' + (exts[0].version || '1.0') : 'Colección Oficial',
                title: exts.length === 1
                    ? `Descubre ${exts[0].name}`
                    : 'Potencia tu entorno con extensiones modulares',
                subtitle: exts.length === 1
                    ? (exts[0].description || 'Herramienta ligera diseñada para integrarse sin fricción en tu flujo diario.')
                    : 'Herramientas ligeras, minimalistas y listas para usar en tu navegador o Homescreen.',
                icons: exts.slice(0, 6),
                ctaLabel: exts.length === 1 ? 'Abrir ficha y vista previa' : 'Explorar catálogo',
                actionType: exts.length === 1 ? 'open-ext' : 'tab-all',
                targetSlug: exts.length === 1 ? getExtensionSlug(exts[0], 0) : null,
                seed: 'hero-welcome'
            });

            if (exts.length > 1) {
                exts.slice(0, 4).forEach((ext, idx) => {
                    slides.push({
                        eyebrow: ext.featured ? 'Destacada' : (ext.category || 'Extensión'),
                        title: ext.name,
                        subtitle: ext.description || 'Explora los detalles técnicos y prueba esta extensión.',
                        icons: [ext],
                        ctaLabel: 'Abrir ficha',
                        actionType: 'open-ext',
                        targetSlug: getExtensionSlug(ext, idx),
                        seed: ext.id || ext.name
                    });
                });
            } else if (exts.length === 1) {
                const single = exts[0];
                const tagsText = (single.tags && single.tags.length > 0)
                    ? single.tags.map(t => `#${t}`).join(' · ')
                    : 'Arquitectura modular lista para escalar';
                slides.push({
                    eyebrow: single.category || 'Ecosistema Modular',
                    title: 'Prueba en vivo o integra en tu Homescreen',
                    subtitle: `Ejecuta la demostración interactiva sin salir de la tienda. ${tagsText}.`,
                    icons: [single],
                    ctaLabel: 'Probar demostración',
                    actionType: 'open-ext-preview',
                    targetSlug: getExtensionSlug(single, 0),
                    seed: (single.id || single.name) + '-alt'
                });
            }

            return slides;
        }

        function startHeroTimer() {
            stopHeroTimer();
            if (appData.heroPaused || appData.currentRoute !== 'catalog' || appData.searchQuery.trim()) return;
            heroInterval = setInterval(() => {
                const slides = getHeroSlides();
                if (slides.length > 1) {
                    appData.heroSlideIndex = (appData.heroSlideIndex + 1) % slides.length;
                    renderHeroOnly();
                }
            }, 6500);
        }

        function stopHeroTimer() {
            if (heroInterval) {
                clearInterval(heroInterval);
                heroInterval = null;
            }
        }

        function renderHeroOnly() {
            const heroContainer = document.getElementById('hero-banner-slot');
            if (!heroContainer) return;
            heroContainer.innerHTML = buildHeroHTML();
            lucide.createIcons({ root: heroContainer });
        }

        function buildHeroHTML() {
            const slides = getHeroSlides();
            if (slides.length === 0) return '';
            const safeIdx = appData.heroSlideIndex % slides.length;
            const slide = slides[safeIdx];
            const art = generateAbstractArt(slide.seed, safeIdx);

            return `
                <section class="hero-banner-wrapper" aria-label="Destacados">
                    <div class="hero-bg-art" style="background: ${art.background};">
                        ${art.svg}
                    </div>

                    <div class="hero-slide">
                        <span class="hero-eyebrow">
                            <i data-lucide="sparkles" size="13" style="color: var(--accent-success);"></i>
                            <span>${escapeHTML(slide.eyebrow)}</span>
                        </span>

                        <h2 class="hero-title">${escapeHTML(slide.title)}</h2>
                        <p class="hero-subtitle">${escapeHTML(slide.subtitle)}</p>

                        <div class="hero-icons-showcase">
                            ${slide.icons.map(item => {
                                const slug = getExtensionSlug(item, appData.extensions.indexOf(item));
                                return `
                                    <button class="hero-app-tile" data-slug="${escapeHTML(slug)}" title="${escapeHTML(item.name)}">
                                        <i data-lucide="${resolveSafeIcon(item.icon)}" size="25"></i>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <button class="hero-cta-btn" id="hero-main-cta"
                            data-action="${escapeHTML(slide.actionType)}"
                            data-slug="${escapeHTML(slide.targetSlug || '')}">
                            <span>${escapeHTML(slide.ctaLabel)}</span>
                            <i data-lucide="arrow-right" size="15"></i>
                        </button>
                    </div>

                    <div class="hero-controls">
                        <button class="hero-ctrl-btn" id="hero-prev" aria-label="Anterior">
                            <i data-lucide="chevron-left" size="15"></i>
                        </button>
                        <span>${safeIdx + 1} / ${slides.length}</span>
                        <button class="hero-ctrl-btn" id="hero-next" aria-label="Siguiente">
                            <i data-lucide="chevron-right" size="15"></i>
                        </button>
                        <button class="hero-ctrl-btn" id="hero-pause" aria-label="${appData.heroPaused ? 'Reanudar' : 'Pausar'}">
                            <i data-lucide="${appData.heroPaused ? 'play' : 'pause'}" size="13"></i>
                        </button>
                    </div>
                </section>
            `;
        }

        /* =========================================================
           RENDERIZADO DE PESTAÑAS Y CATÁLOGO
           ========================================================= */
        function renderTopNavigation() {
            const counterEl = document.getElementById('tools-counter');
            const total = appData.extensions.length;
            counterEl.textContent = appData.isLoading && total === 0
                ? 'Sincronizando...'
                : `${total} ${total === 1 ? 'disponible' : 'disponibles'}`;

            const tabsEl = document.getElementById('nav-tabs');
            const categories = [...new Set(appData.extensions.map(e => e.category).filter(Boolean))];
            const tabs = ['Descubrir', 'Todas', ...categories];

            if (!tabs.includes(appData.activeTab)) {
                appData.activeTab = 'Descubrir';
            }

            tabsEl.innerHTML = tabs.map(tab => {
                const isActive = appData.currentRoute === 'catalog' && !appData.searchQuery.trim() && appData.activeTab === tab;
                return `
                    <button class="nav-tab ${isActive ? 'active' : ''}" data-tab="${escapeHTML(tab)}">
                        ${escapeHTML(tab)}
                    </button>
                `;
            }).join('');
        }

        function renderStandardCard(ext) {
            const idx = appData.extensions.indexOf(ext);
            const slug = getExtensionSlug(ext, idx);
            const safeIcon = resolveSafeIcon(ext.icon);
            const art = generateAbstractArt(ext.id || ext.name, idx);
            const primaryTag = (ext.tags && ext.tags[0]) ? `#${ext.tags[0]}` : (ext.author || 'Extensión');
            const isInstalled = appData.installedIds.includes(slug);

            return `
                <article class="ext-card" data-slug="${escapeHTML(slug)}">
                    <div class="card-cover" style="background: ${art.background};">
                        ${art.svg}
                        <div class="card-floating-icon">
                            <i data-lucide="${safeIcon}" size="21"></i>
                        </div>
                        <div class="card-badges-top">
                            ${isInstalled ? '<span class="badge badge-accent"><i data-lucide="check" size="11"></i> Obtenida</span>' : ''}
                            ${ext.featured && !isInstalled ? '<span class="badge badge-featured"><i data-lucide="sparkles" size="11"></i> Destacada</span>' : ''}
                            <span class="badge badge-version">v${escapeHTML(ext.version || '1.0')}</span>
                        </div>
                    </div>

                    <div class="card-content">
                        <div class="card-body">
                            <h3>${escapeHTML(ext.name)}</h3>
                            <p>${escapeHTML(ext.description || 'Sin descripción disponible.')}</p>
                        </div>

                        <div class="card-footer">
                            <span class="badge badge-neutral">${escapeHTML(primaryTag)}</span>
                            <span class="card-cta">
                                <span>Detalles</span>
                                <i data-lucide="chevron-right" size="14"></i>
                            </span>
                        </div>
                    </div>
                </article>
            `;
        }

        function updateCarouselControlsVisibility() {
            document.querySelectorAll('.carousel-track').forEach(track => {
                const controls = document.querySelector(`[data-controls-for="${track.id}"]`);
                if (!controls) return;
                const hasOverflow = track.scrollWidth > track.clientWidth + 4;
                controls.classList.toggle('hidden-controls', !hasOverflow);
            });
        }

        function renderCatalogView(container) {
            if (appData.isLoading && appData.extensions.length === 0) {
                container.innerHTML = `<div class="skeleton-hero"></div>`;
                return;
            }

            const query = appData.searchQuery.trim().toLowerCase();

            if (query) {
                const filtered = appData.extensions.filter(ext => {
                    const haystack = [
                        ext.name,
                        ext.description,
                        ext.author,
                        ext.category,
                        ...(ext.tags || [])
                    ].join(' ').toLowerCase();
                    return haystack.includes(query);
                });

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="view-section">
                            <div class="empty-state">
                                <i data-lucide="search-x" size="30" style="color: var(--text-muted);"></i>
                                <h3>Sin resultados para "${escapeHTML(appData.searchQuery.trim())}"</h3>
                                <p>Prueba con otro término, categoría o etiqueta diferente.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="view-section">
                        <section class="shelf-section">
                            <div class="shelf-header">
                                <div class="shelf-title-group">
                                    <h2 class="shelf-title">Resultados de búsqueda</h2>
                                    <span class="shelf-subtitle">${filtered.length} ${filtered.length === 1 ? 'coincidencia' : 'coincidencias'}</span>
                                </div>
                            </div>
                            <div class="results-grid">
                                ${filtered.map(ext => renderStandardCard(ext)).join('')}
                            </div>
                        </section>
                    </div>
                `;
                return;
            }

            if (appData.activeTab !== 'Descubrir') {
                const list = appData.activeTab === 'Todas'
                    ? appData.extensions
                    : appData.extensions.filter(e => e.category === appData.activeTab);

                container.innerHTML = `
                    <div class="view-section">
                        <section class="shelf-section">
                            <div class="shelf-header">
                                <div class="shelf-title-group">
                                    <h2 class="shelf-title">${escapeHTML(appData.activeTab)}</h2>
                                    <span class="shelf-subtitle">${list.length} ${list.length === 1 ? 'extensión' : 'extensiones'}</span>
                                </div>
                            </div>
                            <div class="results-grid">
                                ${list.map(ext => renderStandardCard(ext)).join('')}
                            </div>
                        </section>
                    </div>
                `;
                return;
            }

            const categories = [...new Set(appData.extensions.map(e => e.category || 'General'))];
            const featuredList = appData.extensions.filter(e => e.featured);

            let html = `<div class="view-section">`;
            html += `<div id="hero-banner-slot">${buildHeroHTML()}</div>`;

            // Categorías Principales
            html += `
                <section class="shelf-section">
                    <div class="shelf-header">
                        <div class="shelf-title-group">
                            <h2 class="shelf-title">Categorías principales</h2>
                        </div>
                        <div class="carousel-controls" data-controls-for="track-categories">
                            <button class="carousel-nav-btn" data-scroll-target="track-categories" data-dir="-1" aria-label="Anterior">
                                <i data-lucide="chevron-left" size="16"></i>
                            </button>
                            <button class="carousel-nav-btn" data-scroll-target="track-categories" data-dir="1" aria-label="Siguiente">
                                <i data-lucide="chevron-right" size="16"></i>
                            </button>
                        </div>
                    </div>
                    <div class="carousel-track" id="track-categories">
                        ${categories.map((cat, idx) => {
                            const count = appData.extensions.filter(e => (e.category || 'General') === cat).length;
                            const art = generateAbstractArt(cat, idx + 2);
                            return `
                                <div class="category-tile" data-select-tab="${escapeHTML(cat)}" style="background: ${art.background};">
                                    <div class="category-tile-info">
                                        <span class="category-tile-name">${escapeHTML(cat)}</span>
                                        <span class="category-tile-count">${count} ${count === 1 ? 'app' : 'apps'}</span>
                                    </div>
                                    <div class="category-tile-icon">
                                        <i data-lucide="${getCategoryIcon(cat)}" size="17"></i>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        <div class="category-tile" data-select-tab="Todas" style="background: linear-gradient(135deg, #16161a 0%, #242429 100%);">
                            <div class="category-tile-info">
                                <span class="category-tile-name">Explorar todo</span>
                                <span class="category-tile-count">${appData.extensions.length} en catálogo</span>
                            </div>
                            <div class="category-tile-icon">
                                <i data-lucide="grid" size="17"></i>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            // Recomendadas para ti
            const recommendedList = featuredList.length > 0 ? featuredList : appData.extensions;
            html += `
                <section class="shelf-section">
                    <div class="shelf-header">
                        <div class="shelf-title-group">
                            <h2 class="shelf-title">Recomendadas para ti</h2>
                            <span class="shelf-subtitle">Selección verificada</span>
                        </div>
                        <div class="carousel-controls" data-controls-for="track-recommended">
                            <button class="carousel-nav-btn" data-scroll-target="track-recommended" data-dir="-1" aria-label="Anterior">
                                <i data-lucide="chevron-left" size="16"></i>
                            </button>
                            <button class="carousel-nav-btn" data-scroll-target="track-recommended" data-dir="1" aria-label="Siguiente">
                                <i data-lucide="chevron-right" size="16"></i>
                            </button>
                        </div>
                    </div>
                    <div class="carousel-track" id="track-recommended">
                        ${recommendedList.map(ext => renderStandardCard(ext)).join('')}
                    </div>
                </section>
            `;

            // Carruseles dinámicos por categoría si hay más de 1 extensión
            if (categories.length > 1 || appData.extensions.length > 1) {
                categories.forEach((cat, idx) => {
                    const items = appData.extensions.filter(e => (e.category || 'General') === cat);
                    const trackId = `track-cat-${idx}`;
                    html += `
                        <section class="shelf-section">
                            <div class="shelf-header">
                                <div class="shelf-title-group">
                                    <h2 class="shelf-title">${escapeHTML(cat)}</h2>
                                    <span class="shelf-subtitle">${items.length}</span>
