<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tienda de Extensiones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Aplicaciones externas: capa visual independiente, coherente con las tarjetas existentes. */
        .app-store-card { cursor:pointer; }
        .app-card-cover { position:relative; overflow:hidden; }
        .app-card-cover::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.16)); }
        .app-preview-image { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.78; }
        .app-card-title-row { display:flex; align-items:center; gap:9px; }
        .app-card-title-row h3 { min-width:0; }
        .app-status-dot { flex:0 0 7px; width:7px; height:7px; border-radius:50%; background:#34d399; box-shadow:0 0 10px currentColor; }
        .app-status-dot.is-experimental { background:#fbbf24; }
        .app-status-dot.is-unavailable { background:#f87171; }
        .app-detail-icon { color:var(--app-accent); border-color:color-mix(in srgb,var(--app-accent) 35%,transparent); }
        .app-detail-actions .btn-primary:disabled,.app-detail-actions .btn-secondary:disabled { opacity:.45; cursor:not-allowed; }
        .app-install-hint { display:flex; align-items:flex-start; gap:13px; margin:22px 0; padding:17px 19px; border:1px solid color-mix(in srgb,var(--app-accent) 28%,var(--border-color,rgba(255,255,255,.08))); border-radius:16px; background:linear-gradient(110deg,color-mix(in srgb,var(--app-accent) 9%,rgba(255,255,255,.025)),rgba(255,255,255,.018)); }
        .app-install-hint-icon { width:32px; height:32px; flex:0 0 32px; display:grid; place-items:center; border-radius:10px; color:var(--app-accent); background:color-mix(in srgb,var(--app-accent) 13%,transparent); }
        .app-install-hint strong { display:block; color:var(--text-main); font-size:13px; font-weight:600; }
        .app-install-hint p { margin:5px 0 0; color:var(--text-muted); font-size:12.5px; line-height:1.65; }
        .app-detail-stage { min-height:260px; overflow:hidden; position:relative; display:grid; place-items:center; }
        .app-detail-stage > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.55; }
        .app-detail-stage > svg { position:absolute; inset:0; width:100%; height:100%; opacity:.8; }
        .app-detail-stage-overlay { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:28px; }
        .app-detail-stage-overlay h3 { margin:0; color:var(--text-main); font-size:22px; font-weight:600; }
        .app-detail-stage-overlay span { color:var(--text-muted); font-size:12px; }
        .app-keywords,.app-external-links { display:flex; flex-wrap:wrap; gap:8px; }
        .app-external-links a { display:inline-flex; align-items:center; gap:7px; padding:9px 12px; border:1px solid var(--border-color,rgba(255,255,255,.1)); border-radius:10px; color:var(--text-muted); text-decoration:none; font-size:12px; transition:.2s ease; }
        .app-external-links a:hover { color:var(--text-main); border-color:color-mix(in srgb,var(--app-accent) 50%,transparent); }
        @media(max-width:640px) { .app-install-hint { padding:14px; } .app-detail-actions { width:100%; } .app-detail-actions button { flex:1; } }

        .app-card-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
        .app-card-meta-item{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--border-color,rgba(255,255,255,.09));border-radius:8px;color:var(--text-muted);font-size:10.5px}
        .app-card-meta-item i{width:12px;height:12px}
        .app-data-group{margin-top:24px}
        .app-data-group h3{margin:0 0 13px;font-size:15px;font-weight:600;color:var(--text-main)}
        .app-data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
        .app-data-item{min-width:0;padding:13px 14px;border:1px solid var(--border-color,rgba(255,255,255,.09));border-radius:13px;background:rgba(255,255,255,.025)}
        .app-data-item-label{display:flex;align-items:center;gap:7px;color:var(--text-muted);font-size:11px;margin-bottom:7px}
        .app-data-item-label i{width:13px;height:13px;color:var(--app-accent,var(--text-muted))}
        .app-data-item-value{display:block;color:var(--text-main);font-size:13px;font-weight:500;overflow-wrap:anywhere;line-height:1.45}
        .app-color-value{display:inline-flex;align-items:center;gap:8px}
        .app-color-swatch{width:16px;height:16px;border-radius:5px;border:1px solid rgba(255,255,255,.25)}
        .app-taxonomy-list{display:flex;flex-wrap:wrap;gap:7px}
        .app-catalog-error{display:flex;gap:14px;align-items:flex-start;padding:22px;border:1px solid rgba(248,113,113,.28);border-radius:16px;background:rgba(248,113,113,.055)}
        .app-catalog-error-icon{flex:0 0 38px;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#f87171;background:rgba(248,113,113,.12)}
        .app-catalog-error h3{margin:1px 0 5px;color:var(--text-main);font-size:15px}
        .app-catalog-error p{margin:0;color:var(--text-muted);font-size:12.5px;line-height:1.6}
        .app-catalog-error button{margin-top:12px}
        @media(max-width:640px){.app-data-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app-data-item{padding:11px}}


        /* Ficha de aplicaciones y herramientas: galería visual + información */
        .app-detail-overview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(310px,.85fr);gap:18px;align-items:stretch;margin:22px 0 30px}
        .app-detail-showcase{margin:0;min-width:0;overflow:hidden;border-radius:20px}
        .app-detail-gallery{height:100%;min-height:330px;position:relative;background:#101014}
        .app-gallery-track{height:100%;min-height:330px;position:relative}
        .app-gallery-slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .3s ease}
        .app-gallery-slide.active{opacity:1;pointer-events:auto}
        .app-gallery-slide img{display:block;width:100%;height:100%;min-height:330px;object-fit:contain;background:#09090b}
        .app-gallery-slide.image-error{display:none}
        .app-gallery-controls{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
        .app-gallery-nav{width:36px;height:36px;border:1px solid rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);pointer-events:auto}
        .app-gallery-nav svg{width:17px;height:17px}
        .app-gallery-count{padding:6px 11px;border-radius:30px;background:rgba(0,0,0,.65);font-size:11px;color:#fff;backdrop-filter:blur(12px)}
        .app-detail-stage-fallback{height:100%;min-height:330px;display:grid;place-items:center;position:relative;overflow:hidden}
        .app-detail-stage-fallback>svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
        .app-detail-fallback-icon{position:relative;z-index:1;width:112px;height:112px;display:grid;place-items:center;border-radius:32px;background:rgba(12,12,16,.72);border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15);color:var(--app-accent)}
        .app-info-card{min-width:0;padding:22px;border:1px solid var(--glass-border-strong);border-radius:20px;background:linear-gradient(155deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:var(--glass-highlight);display:flex;flex-direction:column;gap:16px}
        .app-info-eyebrow,.app-info-section-label{display:flex;align-items:center;gap:7px;color:var(--text-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
        .app-info-card-heading h3{font-size:21px;line-height:1.2;margin-top:9px;letter-spacing:-.025em}
        .app-info-description{font-size:13px;line-height:1.6;color:var(--text-muted)}
        .app-info-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
        .app-info-fact{min-width:0;padding:10px 11px;border:1px solid var(--glass-border);border-radius:11px;background:rgba(0,0,0,.2)}
        .app-info-fact span{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:10px;margin-bottom:5px}
        .app-info-fact span svg{width:12px;height:12px;color:var(--app-accent)}
        .app-info-fact strong{display:block;font-size:12px;font-weight:500;overflow-wrap:anywhere}
        .app-info-flags{display:flex;flex-wrap:wrap;gap:7px}
        .app-info-flag,.app-info-badge,.app-info-color{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border-radius:9px;border:1px solid var(--glass-border);font-size:10.5px;color:var(--text-muted);background:rgba(255,255,255,.025)}
        .app-info-flag svg,.app-info-badge svg,.app-info-color>svg{width:13px;height:13px}
        .app-info-flag.is-on{color:#86d99b;border-color:rgba(52,199,89,.2);background:rgba(52,199,89,.07)}
        .app-info-extra{display:flex;flex-wrap:wrap;gap:7px}
        .app-info-color .app-color-swatch{width:13px;height:13px}
        .app-info-tags,.app-info-keywords{display:flex;flex-direction:column;gap:9px}
        .app-tag-filter{padding:6px 9px;border-radius:8px;border:1px solid color-mix(in srgb,var(--app-accent) 25%,transparent);background:color-mix(in srgb,var(--app-accent) 8%,transparent);color:var(--app-accent);font:500 11px 'Outfit',sans-serif;cursor:pointer;transition:.2s}
        .app-tag-filter:hover{background:color-mix(in srgb,var(--app-accent) 17%,transparent);transform:translateY(-1px)}
        .app-info-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
        .app-info-links a{display:inline-flex;align-items:center;gap:7px;padding:9px 11px;border:1px solid var(--glass-border);border-radius:9px;color:var(--text-muted);text-decoration:none;font-size:11px}
        .app-info-links a:hover{color:var(--text-main);border-color:var(--app-accent)}
        .app-info-links svg{width:14px;height:14px}
        @media(max-width:800px){.app-detail-overview{grid-template-columns:1fr}.app-detail-gallery,.app-gallery-track,.app-detail-stage-fallback{min-height:260px}.app-gallery-slide img{min-height:260px}}
        @media(max-width:480px){.app-info-card{padding:16px}.app-info-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.app-detail-gallery,.app-gallery-track,.app-detail-stage-fallback{min-height:220px}.app-gallery-slide img{min-height:220px}}

    </style>

</head>
<body>

    <!-- Barra Superior Estilo Chrome Web Store -->
    <header class="top-navbar">
        <div class="navbar-inner">
            <div class="navbar-top-row">
                <div class="brand-logo" id="brand-home-btn" role="button" tabindex="0" aria-label="Ir a inicio">
                    <div class="app-icon-badge">
                        <i data-lucide="puzzle" size="19" style="color: var(--text-main);"></i>
                    </div>
                    <div class="brand-title-wrap">
                        <h1>Extensiones</h1>
                        <span class="header-counter" id="tools-counter"></span>
                    </div>
                </div>

                <div class="search-bar-pill">
                    <i data-lucide="search" size="16" style="color: var(--text-muted); flex-shrink: 0;"></i>
                    <input type="text" id="search-input" placeholder="Buscar extensiones, funciones o etiquetas...">
                    <span class="kbd-hint">/</span>
                    <button class="search-clear-btn" id="search-clear" aria-label="Limpiar búsqueda">
                        <i data-lucide="x" size="14"></i>
                    </button>
                </div>

                <div class="header-actions-right">
                    <button class="header-action icon-only" id="btn-sync-catalog" title="Sincronizar catálogo" aria-label="Sincronizar catálogo">
                        <i data-lucide="refresh-cw" size="15"></i>
                    </button>
                    <a class="header-action" href="https://github.com/CapybaraGalaxy/homescreen-online/tree/main/custom-tools" target="_blank" rel="noopener">
                        <i data-lucide="code" size="15"></i>
                        <span>Repositorio</span>
                    </a>
                </div>
            </div>

            <nav class="nav-tabs-row" id="nav-tabs" aria-label="Navegación principal"></nav>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="app-container" id="main-content"></main>

    <!-- Selector de destino: Homescreen gestiona la instalación real -->
    <div class="modal-backdrop" id="install-modal" role="dialog" aria-modal="true" aria-labelledby="modal-ext-title">
        <div class="modal-card install-destination-card">
            <div class="modal-header">
                <h3 id="modal-ext-title">Instalar en Homescreen</h3>
                <button class="modal-close" id="btn-close-modal" aria-label="Cerrar"><i data-lucide="x" size="16"></i></button>
            </div>
            <p class="install-modal-description" id="modal-ext-desc">Elige dónde quieres abrir Homescreen para completar la instalación.</p>
            <div class="install-warning" id="modal-install-warning" hidden>
                <i data-lucide="flask-conical" size="16"></i><span id="modal-install-warning-text"></span>
            </div>
            <div class="install-destinations">
                <button class="install-destination-btn" type="button" data-hs-destination="github">
                    <span class="install-destination-icon"><i data-lucide="cat" size="19"></i></span>
                    <span class="install-destination-copy"><strong>GitHub Pages</strong><small>Versión alojada en GitHub (github.io)</small></span>
                    <i data-lucide="arrow-up-right" size="17"></i>
                </button>
                <button class="install-destination-btn" type="button" data-hs-destination="cloudflare">
                    <span class="install-destination-icon"><i data-lucide="cloud" size="19"></i></span>
                    <span class="install-destination-copy"><strong>Cloudflare</strong><small>Versión alojada en Cloudflare (workers.dev)</small></span>
                    <i data-lucide="arrow-up-right" size="17"></i>
                </button>
            </div>
            <p class="install-modal-footnote">Homescreen NEO te pedirá confirmar la instalación. La tienda no instala ni modifica herramientas directamente.</p>
        </div>
    </div>

    <!-- Notificación Toast Flotante -->
    <div class="toast-notification" id="toast-msg" role="status" aria-live="polite"></div>

    <script>
        const BASE_URL = 'https://raw.githubusercontent.com/CapybaraGalaxy/homescreen-online/main/custom-tools/';
        const APPS_BASE_URL = 'https://raw.githubusercontent.com/CapybaraGalaxy/homescreen-online/main/custom-apps/';
        const APPS_PUBLIC_URL = 'https://capybaragalaxy.github.io/homescreen-online/custom-apps/';
        const REPO_URL = 'https://github.com/CapybaraGalaxy/homescreen-online/tree/main/custom-tools';
        const APPS_REPO_URL = 'https://github.com/CapybaraGalaxy/homescreen-online/tree/main/custom-apps';
        const STORAGE_KEY = 'neo_extensions_store_v4';

const ART_PALETTES = [
    { bg: 'linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0f1015 100%)', stroke: '#38bdf8' },
    { bg: 'linear-gradient(135deg, #1a1025 0%, #2d1b4e 50%, #111015 100%)', stroke: '#c084fc' },
    { bg: 'linear-gradient(135deg, #0c2218 0%, #143d2b 50%, #0e1210 100%)', stroke: '#34d399' },
    { bg: 'linear-gradient(135deg, #271710 0%, #432315 50%, #14100e 100%)', stroke: '#fb923c' },
    { bg: 'linear-gradient(135deg, #121826 0%, #1e293b 50%, #0c0e14 100%)', stroke: '#818cf8' },
    { bg: 'linear-gradient(135deg, #23111c 0%, #3f182e 50%, #120d10 100%)', stroke: '#f472b6' },
    { bg: 'linear-gradient(135deg, #102125 0%, #173842 50%, #0b1114 100%)', stroke: '#22d3ee' },
    { bg: 'linear-gradient(135deg, #23190f 0%, #48301c 50%, #130e0a 100%)', stroke: '#facc15' },
    { bg: 'linear-gradient(135deg, #261212 0%, #491f1f 50%, #130a0a 100%)', stroke: '#f87171' },
    { bg: 'linear-gradient(135deg, #181226 0%, #30204d 50%, #0f0d14 100%)', stroke: '#a78bfa' },
    { bg: 'linear-gradient(135deg, #0f221a 0%, #193d2e 50%, #0a1310 100%)', stroke: '#4ade80' },
    { bg: 'linear-gradient(135deg, #241124 0%, #462044 50%, #120a12 100%)', stroke: '#e879f9' },
    { bg: 'linear-gradient(135deg, #111e26 0%, #1a3444 50%, #0a1114 100%)', stroke: '#60a5fa' },
    { bg: 'linear-gradient(135deg, #1e2110 0%, #383d1c 50%, #10120a 100%)', stroke: '#a3e635' },
    { bg: 'linear-gradient(135deg, #261810 0%, #472c1c 50%, #140d0a 100%)', stroke: '#fbbf24' },
    { bg: 'linear-gradient(135deg, #141226 0%, #242049 50%, #0b0a14 100%)', stroke: '#818cf8' },
    { bg: 'linear-gradient(135deg, #26101d 0%, #471d34 50%, #140a11 100%)', stroke: '#fb7185' },
    { bg: 'linear-gradient(135deg, #0f2622 0%, #19453c 50%, #0a1412 100%)', stroke: '#2dd4bf' },
    { bg: 'linear-gradient(135deg, #261f10 0%, #47381c 50%, #14110a 100%)', stroke: '#fde047' },
    { bg: 'linear-gradient(135deg, #101c26 0%, #1c3247 50%, #0a1014 100%)', stroke: '#38bdf8' },
    { bg: 'linear-gradient(135deg, #211026 0%, #3b1c47 50%, #110a14 100%)', stroke: '#c084fc' },
    { bg: 'linear-gradient(135deg, #112616 0%, #1c4728 50%, #0a140d 100%)', stroke: '#4ade80' },
    { bg: 'linear-gradient(135deg, #261410 0%, #47261c 50%, #140b0a 100%)', stroke: '#fb923c' },
    { bg: 'linear-gradient(135deg, #161026 0%, #281c47 50%, #0d0a14 100%)', stroke: '#818cf8' },
    { bg: 'linear-gradient(135deg, #261022 0%, #471c3c 50%, #140a12 100%)', stroke: '#f472b6' }
];

        const FALLBACK_EXTENSIONS = []; // Sin datos de ejemplo si falla el catálogo.

        let appData = {
            extensions: [],
            applications: [],
            installedIds: [],
            activeTab: 'Descubrir',
            searchQuery: '',
            currentRoute: 'catalog',
            selectedExtensionId: null,
            selectedApplicationId: null,
            heroSlideIndex: 0,
            heroPaused: false,
            detailSlideIndex: 0,
            previewFullscreen: false,
            previewHtml: '',
            previewLoading: false,
            isLoading: true,
            applicationsLoading: true,
            applicationsError: false,
            extensionsError: false
        };

        let heroInterval = null;
        let toastTimeout = null;

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    extensionsCache: appData.extensions,
                    applicationsCache: appData.applications,
                    installedIds: appData.installedIds
                }));
            } catch (e) {}
        }

        function showToast(message, iconName = 'check-circle-2') {
            const toast = document.getElementById('toast-msg');
            toast.innerHTML = `<i data-lucide="${iconName}" size="15" style="color: var(--accent-success);"></i><span>${escapeHTML(message)}</span>`;
            lucide.createIcons({ root: toast });
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);
        }

        function escapeHTML(str) {
            return String(str ?? '').replace(/[&<>"']/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match]));
        }

        function resolveSafeIcon(iconName) {
            if (!iconName || typeof iconName !== 'string') return 'puzzle';
            const clean = iconName.trim().toLowerCase();
            return clean.length > 0 ? clean : 'puzzle';
        }

        function getApplicationSlug(app, idx) {
            return String(app.id || app.file || app.name || idx)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function getApplicationUrl(app) {
            if (!app?.file) return '';
            // file procede del catálogo oficial; se codifica cada segmento sin alterar las barras.
            const safePath = String(app.file).split('/').map(encodeURIComponent).join('/');
            return APPS_PUBLIC_URL + safePath;
        }

        function getApplicationStatusLabel(app) {
            const status = String(app?.status || '').toLowerCase();
            if (['active', 'stable', 'enabled'].includes(status)) return 'Disponible';
            if (['demo'].includes(status)) return 'Demo';
            if (['experimental'].includes(status)) return 'Experimental';
            if (['disabled', 'inactive', 'off', 'hidden', 'blocked', 'unavailable'].includes(status)) return 'No disponible';
            return app?.status || 'Disponible';
        }

        function getApplicationStatusClass(app) {
            const status = String(app?.status || '').toLowerCase();
            if (['disabled', 'inactive', 'off', 'hidden', 'blocked', 'unavailable'].includes(status)) return 'is-unavailable';
            if (['demo', 'experimental'].includes(status)) return 'is-experimental';
            return 'is-active';
        }

        function copyApplicationUrl(app) {
            const url = getApplicationUrl(app);
            if (!url) {
                showToast('Esta aplicación no tiene una dirección válida', 'alert-circle');
                return;
            }
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(url)
                    .then(() => showToast('Dirección copiada. Añádela como App personalizada.'))
                    .catch(() => showToast('No se pudo copiar la dirección', 'alert-circle'));
            } else {
                const field = document.createElement('textarea');
                field.value = url;
                field.style.position = 'fixed';
                field.style.opacity = '0';
                document.body.appendChild(field);
                field.select();
                const copied = document.execCommand('copy');
                field.remove();
                showToast(copied ? 'Dirección copiada. Añádela como App personalizada.' : 'No se pudo copiar la dirección', copied ? 'check-circle-2' : 'alert-circle');
            }
        }

        function getExtensionSlug(ext, idx) {
            return String(ext.id || ext.file || ext.name || idx)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

/* =========================================================
    GENERADOR DE ARTE ABSTRACTO Y DEGRADADOS (SIN FOTOS) - 10 DISEÑOS
    ========================================================= */
function generateAbstractArt(seedText, variantOffset = 0) {
    const hash = hashString(String(seedText || 'neo')) + variantOffset;
    const palette = ART_PALETTES[hash % ART_PALETTES.length];
    const patternType = hash % 10;
    const c = palette.stroke;

    let svgPattern = '';
    if (patternType === 0) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="p-${hash}" width="80" height="80" patternUnits="userSpaceOnUse">
                        <rect x="4" y="4" width="34" height="34" rx="10" fill="none" stroke="${c}" stroke-width="1.2" stroke-opacity="0.45"/>
                        <rect x="42" y="42" width="34" height="34" rx="10" fill="${c}" fill-opacity="0.08" stroke="${c}" stroke-width="1.2" stroke-opacity="0.35"/>
                        <circle cx="59" cy="21" r="10" fill="none" stroke="${c}" stroke-width="1.2" stroke-opacity="0.35"/>
                        <circle cx="21" cy="59" r="6" fill="${c}" fill-opacity="0.25"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#p-${hash})"/>
            </svg>
        `;
    } else if (patternType === 1) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="${c}" stroke-width="1.3">
                    <circle cx="320" cy="40" r="65" stroke-opacity="0.35"/>
                    <circle cx="320" cy="40" r="105" stroke-opacity="0.25"/>
                    <circle cx="320" cy="40" r="145" stroke-opacity="0.15"/>
                    <path d="M-20 160 Q 110 90, 220 150 T 430 120" stroke-opacity="0.4"/>
                    <path d="M-20 185 Q 110 115, 220 175 T 430 145" stroke-opacity="0.22"/>
                </g>
            </svg>
        `;
    } else if (patternType === 2) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="g-${hash}" width="48" height="48" patternUnits="userSpaceOnUse">
                        <path d="M 48 0 L 0 0 0 48" fill="none" stroke="${c}" stroke-width="1" stroke-opacity="0.25"/>
                        <circle cx="0" cy="0" r="2.2" fill="${c}" fill-opacity="0.5"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#g-${hash})"/>
                <circle cx="290" cy="100" r="70" fill="${c}" fill-opacity="0.12"/>
            </svg>
        `;
    } else if (patternType === 3) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="${c}" stroke-width="1.2">
                    <ellipse cx="200" cy="100" rx="150" ry="52" transform="rotate(-14 200 100)" stroke-opacity="0.35"/>
                    <ellipse cx="200" cy="100" rx="150" ry="52" transform="rotate(14 200 100)" stroke-opacity="0.22"/>
                    <circle cx="95" cy="72" r="5" fill="${c}" fill-opacity="0.55"/>
                    <circle cx="305" cy="128" r="7" fill="${c}" fill-opacity="0.35"/>
                </g>
            </svg>
        `;
    } else if (patternType === 4) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g stroke="${c}" stroke-width="1.1" fill="none">
                    <line x1="0" y1="50" x2="400" y2="50" stroke-opacity="0.3"/>
                    <line x1="0" y1="100" x2="400" y2="100" stroke-opacity="0.4"/>
                    <line x1="0" y1="150" x2="400" y2="150" stroke-opacity="0.3"/>
                    <polygon points="200,40 240,110 160,110" fill="${c}" fill-opacity="0.1" stroke-opacity="0.5"/>
                    <circle cx="200" cy="100" r="25" stroke-opacity="0.6"/>
                </g>
            </svg>
        `;
    } else if (patternType === 5) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g stroke="${c}" stroke-width="1" stroke-opacity="0.35">
                    <line x1="200" y1="100" x2="50" y2="20" />
                    <line x1="200" y1="100" x2="350" y2="20" />
                    <line x1="200" y1="100" x2="50" y2="180" />
                    <line x1="200" y1="100" x2="350" y2="180" />
                    <line x1="200" y1="100" x2="200" y2="10" />
                    <line x1="200" y1="100" x2="200" y2="190" />
                    <circle cx="200" cy="100" r="45" fill="${c}" fill-opacity="0.1" />
                </g>
            </svg>
        `;
    } else if (patternType === 6) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="d-${hash}" width="30" height="30" patternUnits="userSpaceOnUse">
                        <circle cx="15" cy="15" r="3" fill="${c}" fill-opacity="0.3"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#d-${hash})"/>
                <path d="M 0 50 Q 200 150 400 50" fill="none" stroke="${c}" stroke-width="1.5" stroke-opacity="0.4"/>
            </svg>
        `;
    } else if (patternType === 7) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="${c}" stroke-width="1.2">
                    <rect x="80" y="30" width="80" height="140" rx="40" stroke-opacity="0.4"/>
                    <rect x="240" y="30" width="80" height="140" rx="40" stroke-opacity="0.25"/>
                    <line x1="160" y1="100" x2="240" y2="100" stroke-dasharray="4,4" stroke-opacity="0.5"/>
                </g>
            </svg>
        `;
    } else if (patternType === 8) {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="${c}" stroke-width="1.4">
                    <path d="M 50 150 L 150 50 L 250 150 L 350 50" stroke-opacity="0.35"/>
                    <path d="M 50 170 L 150 70 L 250 170 L 350 70" stroke-opacity="0.2"/>
                    <circle cx="150" cy="50" r="6" fill="${c}" fill-opacity="0.5"/>
                    <circle cx="250" cy="150" r="6" fill="${c}" fill-opacity="0.5"/>
                </g>
            </svg>
        `;
    } else {
        svgPattern = `
            <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="${c}" stroke-width="1.2">
                    <rect x="120" y="20" width="160" height="160" rx="80" stroke-opacity="0.3" transform="rotate(45 200 100)"/>
                    <rect x="140" y="40" width="120" height="120" rx="60" stroke-opacity="0.2" transform="rotate(45 200 100)"/>
                    <circle cx="200" cy="100" r="15" fill="${c}" fill-opacity="0.3"/>
                </g>
            </svg>
        `;
    }

    return {
        background: palette.bg,
        svg: svgPattern
    };
}
        function getCategoryIcon(categoryName) {
            const cat = (categoryName || '').toLowerCase();
            if (cat.includes('ia') || cat.includes('inteligencia')) return 'sparkles';
            if (cat.includes('util')) return 'wrench';
            if (cat.includes('prod')) return 'clock';
            if (cat.includes('diseñ')) return 'palette';
            if (cat.includes('desarr') || cat.includes('dev')) return 'code';
            return 'layers';
        }

        /* =========================================================
           NAVEGACIÓN Y RUTAS
           ========================================================= */
        function navigateToExtension(slug, pushHistory = true) {
            const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === slug);
            if (!ext) {
                navigateToCatalog(false);
                return;
            }
            appData.currentRoute = 'detail';
            appData.selectedExtensionId = slug;
            appData.detailSlideIndex = 0;
            appData.previewFullscreen = false;
            appData.previewHtml = '';
            appData.previewLoading = false;

            if (pushHistory) {
                window.history.pushState({ route: 'detail', slug }, '', '#extension/' + encodeURIComponent(slug));
            }
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateToApplication(slug, pushHistory = true) {
            const app = appData.applications.find((item, idx) => getApplicationSlug(item, idx) === slug);
            if (!app) { navigateToCatalog(false); return; }
            appData.currentRoute = 'application';
            appData.selectedApplicationId = slug;
            appData.selectedExtensionId = null;
            appData.previewFullscreen = false;
            appData.previewHtml = '';
            appData.previewLoading = false;
            if (pushHistory) window.history.pushState({ route: 'application', slug }, '', '#app/' + encodeURIComponent(slug));
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateToCatalog(pushHistory = true) {
            appData.currentRoute = 'catalog';
            appData.selectedExtensionId = null;
            appData.selectedApplicationId = null;
            appData.previewFullscreen = false;
            appData.previewHtml = '';
            appData.previewLoading = false;

            if (pushHistory) {
                window.history.pushState({ route: 'catalog' }, '', window.location.pathname + window.location.search);
            }
            renderApp();
        }

        window.addEventListener('popstate', () => {
            syncRouteFromHash();
            renderApp();
        });

        function syncRouteFromHash() {
            const hash = window.location.hash || '';
            if (hash.startsWith('#app/')) {
                const slug = decodeURIComponent(hash.slice('#app/'.length));
                const exists = appData.applications.some((item, idx) => getApplicationSlug(item, idx) === slug);
                if (exists) {
                    appData.currentRoute = 'application';
                    appData.selectedApplicationId = slug;
                    appData.selectedExtensionId = null;
                    return;
                }
            }
            if (hash.startsWith('#extension/')) {
                const slug = decodeURIComponent(hash.slice('#extension/'.length));
                const exists = appData.extensions.some((item, idx) => getExtensionSlug(item, idx) === slug);
                if (exists) {
                    appData.currentRoute = 'detail';
                    appData.selectedExtensionId = slug;
                    appData.selectedApplicationId = null;
                    return;
                }
            }
            appData.currentRoute = 'catalog';
            appData.selectedExtensionId = null;
            appData.selectedApplicationId = null;
        }

        function loadInteractivePreview(ext, forceReload = false) {
            if (!ext || !ext.file || appData.previewLoading) return;
            if (forceReload) appData.previewHtml = '';
            appData.previewLoading = true;
            renderApp();

            fetch(BASE_URL + ext.file, { cache: 'no-store' })
                .then(res => {
                    if (!res.ok) throw new Error('Error de red');
                    return res.text();
                })
                .then(html => {
                    appData.previewHtml = html;
                    appData.previewLoading = false;
                    renderApp();
                })
                .catch(() => {
                    appData.previewHtml = '<div style="display:grid;place-items:center;height:100%;background:#0a0a0c;color:#8E8E93;font-family:sans-serif;font-size:13px;padding:24px;text-align:center;">No se pudo cargar la vista previa remota. Puedes abrir el archivo fuente desde el botón superior.</div>';
                    appData.previewLoading = false;
                    renderApp();
                });
        }

        /* =========================================================
           HERO BANNER SLIDES
           ========================================================= */
        function getHeroSlides() {
            const exts = appData.extensions;
            const slides = [];

            slides.push({
                eyebrow: exts.length === 1 ? 'Destacada · v' + (exts[0].version || '1.0') : 'Colección Oficial',
                title: exts.length === 1
                    ? `Descubre ${exts[0].name}`
                    : 'Potencia tu entorno con extensiones modulares',
                subtitle: exts.length === 1
                    ? (exts[0].description || 'Herramienta ligera diseñada para integrarse sin fricción en tu flujo diario.')
                    : 'Herramientas ligeras, minimalistas y listas para usar en tu navegador o Homescreen.',
                icons: exts.slice(0, 6),
                ctaLabel: exts.length === 1 ? 'Abrir ficha y vista previa' : 'Explorar catálogo',
                actionType: exts.length === 1 ? 'open-ext' : 'tab-all',
                targetSlug: exts.length === 1 ? getExtensionSlug(exts[0], 0) : null,
                seed: 'hero-welcome'
            });

            if (exts.length > 1) {
                exts.slice(0, 4).forEach((ext, idx) => {
                    slides.push({
                        eyebrow: ext.featured ? 'Destacada' : (ext.category || 'Extensión'),
                        title: ext.name,
                        subtitle: ext.description || 'Explora los detalles técnicos y prueba esta extensión.',
                        icons: [ext],
                        ctaLabel: 'Abrir ficha',
                        actionType: 'open-ext',
                        targetSlug: getExtensionSlug(ext, idx),
                        seed: ext.id || ext.name
                    });
                });
            } else if (exts.length === 1) {
                const single = exts[0];
                const tagsText = (single.tags && single.tags.length > 0)
                    ? single.tags.map(t => `#${t}`).join(' · ')
                    : 'Arquitectura modular lista para escalar';
                slides.push({
                    eyebrow: single.category || 'Ecosistema Modular',
                    title: 'Prueba en vivo o integra en tu Homescreen',
                    subtitle: `Ejecuta la demostración interactiva sin salir de la tienda. ${tagsText}.`,
                    icons: [single],
                    ctaLabel: 'Probar demostración',
                    actionType: 'open-ext-preview',
                    targetSlug: getExtensionSlug(single, 0),
                    seed: (single.id || single.name) + '-alt'
                });
            }

            return slides;
        }

        function startHeroTimer() {
            stopHeroTimer();
            if (appData.heroPaused || appData.currentRoute !== 'catalog' || appData.searchQuery.trim()) return;
            heroInterval = setInterval(() => {
                const slides = getHeroSlides();
                if (slides.length > 1) {
                    appData.heroSlideIndex = (appData.heroSlideIndex + 1) % slides.length;
                    renderHeroOnly();
                }
            }, 6500);
        }

        function stopHeroTimer() {
            if (heroInterval) {
                clearInterval(heroInterval);
                heroInterval = null;
            }
        }

        function renderHeroOnly() {
            const heroContainer = document.getElementById('hero-banner-slot');
            if (!heroContainer) return;
            heroContainer.innerHTML = buildHeroHTML();
            lucide.createIcons({ root: heroContainer });
        }

        function buildHeroHTML() {
            const slides = getHeroSlides();
            if (slides.length === 0) return '';
            const safeIdx = appData.heroSlideIndex % slides.length;
            const slide = slides[safeIdx];
            const art = generateAbstractArt(slide.seed, safeIdx);

            return `
                <section class="hero-banner-wrapper" aria-label="Destacados">
                    <div class="hero-bg-art" style="background: ${art.background};">
                        ${art.svg}
                    </div>

                    <div class="hero-slide">
                        <span class="hero-eyebrow">
                            <i data-lucide="sparkles" size="13" style="color: var(--accent-success);"></i>
                            <span>${escapeHTML(slide.eyebrow)}</span>
                        </span>

                        <h2 class="hero-title">${escapeHTML(slide.title)}</h2>
                        <p class="hero-subtitle">${escapeHTML(slide.subtitle)}</p>

                        <div class="hero-icons-showcase">
                            ${slide.icons.map(item => {
                                const slug = getExtensionSlug(item, appData.extensions.indexOf(item));
                                return `
                                    <button class="hero-app-tile" data-slug="${escapeHTML(slug)}" title="${escapeHTML(item.name)}">
                                        <i data-lucide="${resolveSafeIcon(item.icon)}" size="25"></i>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <button class="hero-cta-btn" id="hero-main-cta"
                            data-action="${escapeHTML(slide.actionType)}"
                            data-slug="${escapeHTML(slide.targetSlug || '')}">
                            <span>${escapeHTML(slide.ctaLabel)}</span>
                            <i data-lucide="arrow-right" size="15"></i>
                        </button>
                    </div>

                    <div class="hero-controls">
                        <button class="hero-ctrl-btn" id="hero-prev" aria-label="Anterior">
                            <i data-lucide="chevron-left" size="15"></i>
                        </button>
                        <span>${safeIdx + 1} / ${slides.length}</span>
                        <button class="hero-ctrl-btn" id="hero-next" aria-label="Siguiente">
                            <i data-lucide="chevron-right" size="15"></i>
                        </button>
                        <button class="hero-ctrl-btn" id="hero-pause" aria-label="${appData.heroPaused ? 'Reanudar' : 'Pausar'}">
                            <i data-lucide="${appData.heroPaused ? 'play' : 'pause'}" size="13"></i>
                        </button>
                    </div>
                </section>
            `;
        }

        /* =========================================================
           RENDERIZADO DE PESTAÑAS Y CATÁLOGO

        function renderTopNavigation() {
            const counterEl = document.getElementById('tools-counter');
            const total = appData.extensions.length;
            counterEl.textContent = appData.isLoading && total === 0
                ? 'Sincronizando...'
                : `${total} ${total === 1 ? 'disponible' : 'disponibles'}`;

            const tabsEl = document.getElementById('nav-tabs');
            const categories = [...new Set(appData.extensions.map(e => e.category).filter(Boolean))];
            const tabs = ['Descubrir', 'Todas', 'Aplicaciones', ...categories];

            if (!tabs.includes(appData.activeTab)) {
                appData.activeTab = 'Descubrir';

                const isActive = appData.currentRoute === 'catalog' && !appData.searchQuery.trim() && appData.activeTab === tab;
                return `
                    <button class="nav-tab ${isActive ? 'active' : ''}" data-tab="${escapeHTML(tab)}">
                        ${escapeHTML(tab)}
                    </button>
                `;
            }).join('');
        }

        function updateCarouselControlsVisibility() {
            document.querySelectorAll('.carousel-track').forEach(track => {
                const controls = document.querySelector(`[data-controls-for="${track.id}"]`);

                const hasOverflow = track.scrollWidth > track.clientWidth + 4;
                controls.classList.toggle('hidden-controls', !hasOverflow);
            });

                    return haystack.includes(query);

                    icon: 'layers',
                    title: 'Integración Ligera y Rápida',
                    subtitle: tags.length > 0

                                        ? `<div class="app-gallery-track">${gallery.map((image, index) => {
                                            const url = /^https?:\/\//i.test(String(image)) ? String(image) : APPS_PUBLIC_URL + String(image).split('/').map(encodeURIComponent).join('/');
                                            return `<div class="app-gallery-slide ${index === 0 ? 'active' : ''}" data-gallery-slide="${index}"><img src="${escapeHTML(url)}" alt="Captura ${index + 1} de ${escapeHTML(app.name || 'la aplicación')}" loading="${index === 0 ? 'eager' : 'lazy'}" onerror="this.closest('.app-gallery-slide').classList.add('image-error')"></div>`;
                                        }).join('')}</div>
                                        ${gallery.length > 1 ? `<div class="app-gallery-controls"><button type="button" class="app-gallery-nav" data-gallery-dir="-1" aria-label="Imagen anterior"><i data-lucide="chevron-left"></i></button><span class="app-gallery-count"><b id="app-gallery-current">1</b> / ${gallery.length}</span><button type="button" class="app-gallery-nav" data-gallery-dir="1" aria-label="Imagen siguiente"><i data-lucide="chevron-right"></i></button></div>` : ''}`
                                        : `<div class="app-detail-stage app-detail-stage-fallback" style="background:linear-gradient(135deg,${escapeHTML(accent)}30,#111116 72%)">${generateAbstractArt(app.id || app.name, 8).svg}<div class="app-detail-fallback-icon"><i data-lucide="${resolveSafeIcon(app.icon)}" size="58"></i></div></div>`;
                                })()}
                            </div>
                        </div>
                        <aside class="app-info-card">
                            <div class="app-info-card-heading"><span class="app-info-eyebrow"><i data-lucide="info" size="13"></i> Ficha de la publicación</span><h3>${escapeHTML(app.name || 'Aplicación')}</h3></div>
                            <p class="app-info-description">${escapeHTML(app.description || 'Sin descripción disponible.')}</p>
                            <div class="app-info-facts">
                                ${[
                                    ['fingerprint','ID',app.id],
                                    ['user-round','Autor',app.author],
                                    ['folder','Categoría',app.category],
                                    ['tag','Versión',app.version],
                                    ['activity','Estado',app.status ? getApplicationStatusLabel(app) : null],
                                    ['file-code','Archivo',app.file],
                                    ['list-ordered','Orden',app.order],
                                    ['calendar-plus','Creada',app.createdAt],
                                    ['calendar-clock','Actualizada',app.updatedAt]
                                ].filter(item => item[2] !== undefined && item[2] !== null && item[2] !== '').map(([icon,label,value]) => `
                                    <div class="app-info-fact"><span><i data-lucide="${icon}"></i>${label}</span><strong>${escapeHTML(value)}</strong></div>
                                `).join('')}
                            </div>
                            <div class="app-info-flags">
                                ${app.featured !== undefined ? `<span class="app-info-flag ${app.featured ? 'is-on' : ''}"><i data-lucide="star"></i>${app.featured ? 'Destacada' : 'No destacada'}</span>` : ''}
                                ${app.isNew !== undefined ? `<span class="app-info-flag ${app.isNew ? 'is-on' : ''}"><i data-lucide="sparkles"></i>${app.isNew ? 'Nueva' : 'No es nueva'}</span>` : ''}
                                ${app.offlineReady !== undefined ? `<span class="app-info-flag ${app.offlineReady ? 'is-on' : ''}"><i data-lucide="wifi"></i>${app.offlineReady ? 'Funciona sin conexión' : 'Requiere conexión'}</span>` : ''}
                                ${app.requiresExternalAccess !== undefined ? `<span class="app-info-flag ${!app.requiresExternalAccess ? 'is-on' : ''}"><i data-lucide="globe"></i>${app.requiresExternalAccess ? 'Necesita acceso externo' : 'Sin acceso externo'}</span>` : ''}
                            </div>
                            ${app.badge || app.accentColor ? `<div class="app-info-extra">${app.badge ? `<span class="app-info-badge"><i data-lucide="badge-check"></i>${escapeHTML(app.badge)}</span>` : ''}${app.accentColor && /^#[0-9a-f]{3,8}$/i.test(app.accentColor) ? `<span class="app-info-color"><i data-lucide="palette"></i><span class="app-color-swatch" style="background:${escapeHTML(app.accentColor)}"></span>${escapeHTML(app.accentColor)}</span>` : ''}</div>` : ''}
                            ${tags.length ? `<div class="app-info-tags"><span class="app-info-section-label">Etiquetas · pulsa para explorar</span><div class="app-taxonomy-list">${tags.map(tag => `<button type="button" class="app-tag-filter" data-app-tag="${escapeHTML(tag)}">#${escapeHTML(tag)}</button>`).join('')}</div></div>` : ''}
                            ${keywords.length ? `<div class="app-info-keywords"><span class="app-info-section-label">Palabras clave</span><div class="app-keywords">${keywords.map(word => `<span class="badge badge-neutral">${escapeHTML(word)}</span>`).join('')}</div></div>` : ''}
                            ${(app.authorUrl || app.repoUrl) ? `<div class="app-info-links">${app.authorUrl && /^https?:\/\//i.test(app.authorUrl) ? `<a href="${escapeHTML(app.authorUrl)}" target="_blank" rel="noopener noreferrer"><i data-lucide="user-round"></i> Autor</a>` : ''}${app.repoUrl && /^https?:\/\//i.test(app.repoUrl) ? `<a href="${escapeHTML(app.repoUrl)}" target="_blank" rel="noopener noreferrer"><i data-lucide="github"></i> Repositorio</a>` : ''}</div>` : ''}
                        </aside>
                    </section>
                    ${related.length ? `<section class="detail-section-block"><h3>Más aplicaciones</h3><div class="results-grid">${related.map(renderApplicationCard).join('')}</div></section>` : ''}
                </div>`;
        }

        function renderApp() {
            renderTopNavigation();
            const mainContent = document.getElementById('main-content');
            if (appData.currentRoute === 'application') {
                stopHeroTimer();
                renderApplicationDetailPage(mainContent);
            } else if (appData.currentRoute === 'detail') {
                stopHeroTimer();
                renderDetailPage(mainContent);
            } else {
                renderCatalogView(mainContent);
                startHeroTimer();
            }
            lucide.createIcons();
        }

        async function fetchCatalog(manualSync = false) {
            const syncBtn = document.getElementById('btn-sync-catalog');
            if (manualSync && syncBtn) {
                syncBtn.querySelector('svg')?.style.setProperty('animation', 'spin 0.8s linear infinite');
            }
            try {
                const response = await fetch(BASE_URL + 'tools.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const payload = await response.json();
                const sorted = (payload.tools || []).slice().sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
                appData.extensionsError = false;
                if (sorted.length > 0) {
                    appData.extensions = sorted;
                } else {
                    appData.extensions = [];
                }
                if (manualSync) showToast('Catálogo actualizado');
            } catch (e) {
                appData.extensionsError = true;
                if (manualSync) showToast('No se pudo actualizar el catálogo', 'wifi-off');
            } finally {
                appData.isLoading = false;
                saveData();
                syncRouteFromHash();
                renderApp();
            }
        }

        async function fetchApplications(manualSync = false) {
            try {
                const response = await fetch(APPS_BASE_URL + 'apps.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const payload = await response.json();
                const catalogueItems = Array.isArray(payload.apps) ? payload.apps : (Array.isArray(payload.tools) ? payload.tools : []);
                appData.applications = catalogueItems
                    .filter(app => app && app.id && app.file)
                    .slice()
                    .sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
                appData.applicationsError = false;
                try { localStorage.setItem(STORAGE_KEY + '_apps', JSON.stringify(appData.applications)); } catch (e) {}
                if (manualSync) showToast('Catálogo de aplicaciones actualizado');
            } catch (error) {
                appData.applicationsError = true;
                if (manualSync) showToast('No se pudo actualizar el catálogo de aplicaciones', 'wifi-off');
            } finally {
                appData.applicationsLoading = false;
                renderApp();
            }
        }

        const HOMESCREEN_DESTINATIONS = {
            github: 'https://capybaragalaxy.github.io/HOMESCREEN/',
            cloudflare: 'https://homescreen.guilleplayer.workers.dev/'
        };

        function getToolInstallState(ext) {
            const status = String(ext?.status || '').trim().toLowerCase();
            if (['disabled', 'inactive', 'off', 'hidden', 'blocked', 'unavailable', 'desactivada', 'inactiva', 'deshabilitada'].includes(status)) return 'disabled';
            if (['demo', 'experimental'].includes(status)) return 'caution';
            if (['active', 'stable', 'estable', 'enabled'].includes(status)) return 'available';
            return 'disabled';
        }

        function buildHomescreenInstallUrl(ext, destination) {
            const base = HOMESCREEN_DESTINATIONS[destination];
            if (!base || !ext?.id) return null;
            const url = new URL(base);
            url.searchParams.set('hs_install', String(ext.id));
            return url.toString();
        }

        async function openInstallModal(ext) {
            if (!ext?.id) {
                showToast('La herramienta no tiene un identificador válido', 'alert-circle');
                return;
            }

            // Verificar siempre el estado actual del catálogo oficial antes de ofrecer instalar.
            try {
                const response = await fetch(BASE_URL + 'tools.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('No se pudo verificar el catálogo');
                const payload = await response.json();
                const currentTool = (payload.tools || []).find(item => String(item.id || '') === String(ext.id));
                if (!currentTool) {
                    showToast('La herramienta ya no aparece en el catálogo oficial', 'ban');
                    return;
                }
                const index = appData.extensions.findIndex(item => String(item.id || '') === String(ext.id));
                if (index >= 0) appData.extensions[index] = currentTool;
                else appData.extensions.push(currentTool);
                ext = currentTool;
                saveData();
            } catch (error) {
                showToast('No se pudo verificar el estado actual. Inténtalo de nuevo.', 'wifi-off');
                return;
            }

            if (getToolInstallState(ext) === 'disabled') {
                showToast('Esta herramienta no está disponible para instalar', 'ban');
                renderApp();
                return;
            }
            const modal = document.getElementById('install-modal');
            const warning = document.getElementById('modal-install-warning');
            const warningText = document.getElementById('modal-install-warning-text');
            document.getElementById('modal-ext-title').textContent = `Instalar ${ext.name}`;
            document.getElementById('modal-ext-desc').textContent = 'Elige la versión de Homescreen en la que quieres instalar esta herramienta.';
            warning.hidden = getToolInstallState(ext) !== 'caution';
            warningText.textContent = `Esta herramienta está marcada como ${String(ext.status)}. Puede contener funciones incompletas o cambios experimentales.`;
            modal.dataset.toolId = String(ext.id);
            modal.classList.add('open');
            lucide.createIcons({ root: modal });
        }

        function closeInstallModal() {
            document.getElementById('install-modal').classList.remove('open');
        }

        function setupEventListeners() {
            window.addEventListener('resize', updateCarouselControlsVisibility);

            // Atajos de teclado: '/' o Ctrl+K para buscar, Esc para cerrar/limpiar
            document.addEventListener('keydown', e => {
                const searchInput = document.getElementById('search-input');
                const isInputFocused = document.activeElement === searchInput;

                if ((e.key === '/' && !isInputFocused) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
                    e.preventDefault();
                    searchInput.focus();
                    return;
                }

                if (e.key === 'Escape') {
                    const modal = document.getElementById('install-modal');
                    if (modal.classList.contains('open')) {
                        closeInstallModal();
                        return;
                    }
                    if (appData.previewFullscreen) {
                        appData.previewFullscreen = false;
                        renderApp();
                        return;
                    }
                    if (isInputFocused || appData.searchQuery) {
                        appData.searchQuery = '';
                        searchInput.value = '';
                        document.getElementById('search-clear').classList.remove('visible');
                        searchInput.blur();
                        renderApp();
                    }
                }
            });

            // Botón sincronizar catálogo
            document.getElementById('btn-sync-catalog').addEventListener('click', () => {
                Promise.allSettled([fetchCatalog(true), fetchApplications(true)]);
            });
            document.getElementById('main-content').addEventListener('click', (e) => {
                if (e.target.closest('#btn-retry-apps')) {
                    appData.applicationsLoading = true;
                    appData.applicationsError = false;
                    renderApp();
                    fetchApplications(true);
                }
            });

            // Logo superior -> volver a Descubrir
            document.getElementById('brand-home-btn').addEventListener('click', () => {
                appData.searchQuery = '';
                document.getElementById('search-input').value = '';
                document.getElementById('search-clear').classList.remove('visible');
                appData.activeTab = 'Descubrir';
                navigateToCatalog(true);
            });

            // Pestañas de navegación superior
            document.getElementById('nav-tabs').addEventListener('click', e => {
                const tabBtn = e.target.closest('.nav-tab');
                if (!tabBtn) return;
                appData.activeTab = tabBtn.dataset.tab;
                appData.searchQuery = '';
                document.getElementById('search-input').value = '';
                document.getElementById('search-clear').classList.remove('visible');
                if (appData.currentRoute === 'detail') {
                    navigateToCatalog(true);
                } else {
                    renderApp();
                }
            });

            // Buscador superior
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');

            searchInput.addEventListener('input', e => {
                appData.searchQuery = e.target.value;
                searchClear.classList.toggle('visible', appData.searchQuery.length > 0);
                if (appData.currentRoute === 'detail') {
                    navigateToCatalog(false);
                } else {
                    renderApp();
                }
            });

            searchClear.addEventListener('click', () => {
                appData.searchQuery = '';
                searchInput.value = '';
                searchClear.classList.remove('visible');
                searchInput.focus();
                renderApp();
            });

            // Eventos del Modal
            document.getElementById('btn-close-modal').addEventListener('click', closeInstallModal);
            document.getElementById('install-modal').addEventListener('click', e => {
                if (e.target.id === 'install-modal') closeInstallModal();
            });

            document.querySelectorAll('[data-hs-destination]').forEach(button => {
                button.addEventListener('click', () => {
                    const destination = button.dataset.hsDestination;
                    const toolId = document.getElementById('install-modal').dataset.toolId;
                    const ext = appData.extensions.find(item => String(item.id || '') === toolId);
                    if (!ext || getToolInstallState(ext) === 'disabled') {
                        closeInstallModal();
                        showToast('Esta herramienta no está disponible para instalar', 'ban');
                        return;
                    }
                    const targetUrl = buildHomescreenInstallUrl(ext, destination);
                    if (!targetUrl) {
                        showToast('No se pudo generar el enlace de instalación', 'alert-circle');
                        return;
                    }
                    if (window.top !== window.self) {
                        // Evita navegar dentro del marco cuando la tienda está integrada/compacta.
                        const opened = window.open(targetUrl, '_blank', 'noopener,noreferrer');
                        if (!opened) {
                            try { window.top.location.href = targetUrl; }
                            catch (error) { showToast('El navegador ha bloqueado la apertura de Homescreen', 'alert-circle'); }
                        }
                    } else {
                        window.location.assign(targetUrl);
                    }
                });
            });

            // Delegación global en contenido principal
            document.getElementById('main-content').addEventListener('click', e => {
                const tagFilter = e.target.closest('[data-app-tag]');
                if (tagFilter) {
                    appData.searchQuery = tagFilter.dataset.appTag || '';
                    appData.activeTab = 'Descubrir';
                    appData.currentRoute = 'catalog';
                    appData.selectedApplicationId = null;
                    const searchInput = document.getElementById('search-input');
                    if (searchInput) searchInput.value = appData.searchQuery;
                    renderApp();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                const galleryButton = e.target.closest('[data-gallery-dir]');
                if (galleryButton) {
                    const slides = [...document.querySelectorAll('[data-gallery-slide]')];
                    if (slides.length > 1) {
                        const current = slides.findIndex(slide => slide.classList.contains('active'));
                        const next = (current + Number(galleryButton.dataset.galleryDir) + slides.length) % slides.length;
                        slides.forEach((slide, index) => slide.classList.toggle('active', index === next));
                        const counter = document.getElementById('app-gallery-current');
                        if (counter) counter.textContent = String(next + 1);
                    }
                    return;
                }
                const appCard = e.target.closest('[data-app-slug]');
                if (appCard?.dataset.appSlug) {
                    navigateToApplication(appCard.dataset.appSlug, true);
                    return;
                }
                if (e.target.closest('#btn-copy-app-url')) {
                    const app = appData.applications.find((item, idx) => getApplicationSlug(item, idx) === appData.selectedApplicationId);
                    if (app) copyApplicationUrl(app);
                    return;
                }
                if (e.target.closest('#btn-open-app-url')) {
                    const app = appData.applications.find((item, idx) => getApplicationSlug(item, idx) === appData.selectedApplicationId);
                    const url = app && getApplicationUrl(app);
                    if (url) window.open(url, '_blank', 'noopener,noreferrer');
                    return;
                }
                if (e.target.closest('#btn-share-app')) {
                    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(window.location.href).then(() => showToast('Enlace de la ficha copiado')).catch(() => showToast('No se pudo copiar el enlace', 'alert-circle'));
                    return;
                }

                // Controles del Hero Banner
                if (e.target.closest('#hero-prev')) {
                    const len = getHeroSlides().length;
                    appData.heroSlideIndex = (appData.heroSlideIndex - 1 + len) % len;
                    renderHeroOnly();
                    return;
                }
                if (e.target.closest('#hero-next')) {
                    const len = getHeroSlides().length;
                    appData.heroSlideIndex = (appData.heroSlideIndex + 1) % len;
                    renderHeroOnly();
                    return;
                }
                if (e.target.closest('#hero-pause')) {
                    appData.heroPaused = !appData.heroPaused;
                    renderHeroOnly();
                    if (appData.heroPaused) stopHeroTimer();
                    else startHeroTimer();
                    return;
                }

                const heroCta = e.target.closest('#hero-main-cta');
                if (heroCta) {
                    const action = heroCta.dataset.action;
                    if (action === 'open-ext' && heroCta.dataset.slug) {
                        navigateToExtension(heroCta.dataset.slug, true);
                    } else if (action === 'open-ext-preview' && heroCta.dataset.slug) {
                        navigateToExtension(heroCta.dataset.slug, true);
                        appData.detailSlideIndex = 1;
                        const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === heroCta.dataset.slug);
                        if (ext) loadInteractivePreview(ext);
                    } else {
                        appData.activeTab = 'Todas';
                        renderApp();
                    }
                    return;
                }

                // Tarjeta de categoría principal
                const catTile = e.target.closest('[data-select-tab]');
                if (catTile) {
                    appData.activeTab = catTile.dataset.selectTab;
                    renderApp();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }

                // Botones de carruseles horizontales
                const navBtn = e.target.closest('.carousel-nav-btn');
                if (navBtn) {
                    const track = document.getElementById(navBtn.dataset.scrollTarget);
                    if (track) {
                        track.scrollBy({ left: Number(navBtn.dataset.dir) * 320, behavior: 'smooth' });
                    }
                    return;
                }

                // Clic en cualquier tarjeta de extensión o tile del Hero
                const card = e.target.closest('[data-slug]');
                if (card && card.dataset.slug) {
                    navigateToExtension(card.dataset.slug, true);
                    return;
                }

                // Navegación dentro de la vista detalle
                if (e.target.closest('#btn-back-home')) {
                    navigateToCatalog(true);
                    return;
                }

                if (e.target.closest('#btn-share-ext')) {
                    navigator.clipboard?.writeText(window.location.href);
                    showToast('Enlace de la ficha copiado');
                    return;
                }

                if (e.target.closest('#detail-slide-prev')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (!ext) return;
                    const len = buildDetailSlides(ext).length;
                    appData.detailSlideIndex = (appData.detailSlideIndex - 1 + len) % len;
                    renderApp();
                    return;
                }

                if (e.target.closest('#detail-slide-next')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (!ext) return;
                    const len = buildDetailSlides(ext).length;
                    appData.detailSlideIndex = (appData.detailSlideIndex + 1) % len;
                    renderApp();
                    return;
                }

                const thumbBtn = e.target.closest('[data-detail-thumb]');
                if (thumbBtn) {
                    appData.detailSlideIndex = Number(thumbBtn.dataset.detailThumb);
                    renderApp();
                    return;
                }

                if (e.target.closest('#btn-trigger-live-preview')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (ext) loadInteractivePreview(ext);
                    return;
                }

                if (e.target.closest('#btn-reload-preview')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (ext) loadInteractivePreview(ext, true);
                    return;
                }

                if (e.target.closest('#btn-toggle-fullscreen')) {
                    appData.previewFullscreen = !appData.previewFullscreen;
                    renderApp();
                    return;
                }

                if (e.target.closest('#btn-install-ext')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (ext) openInstallModal(ext);
                    return;
                }

                if (e.target.closest('#btn-source-ext')) {
                    const ext = appData.extensions.find((item, idx) => getExtensionSlug(item, idx) === appData.selectedExtensionId);
                    if (ext && ext.file) {
                        window.open(BASE_URL + ext.file, '_blank', 'noopener');
                    }
                }
            });
        }

        window.onload = () => {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed.extensionsCache) && parsed.extensionsCache.length > 0) {
                        appData.extensions = parsed.extensionsCache;
                        appData.isLoading = false;
                    }
                    if (Array.isArray(parsed.installedIds)) {
                        appData.installedIds = parsed.installedIds;
                    }
                    if (Array.isArray(parsed.applicationsCache)) appData.applications = parsed.applicationsCache;
                }
            } catch (e) {
                appData.extensions = [];
            }

            try {
                const cachedApps = JSON.parse(localStorage.getItem(STORAGE_KEY + '_apps') || '[]');
                if (Array.isArray(cachedApps)) appData.applications = cachedApps;
            } catch (e) {}
            syncRouteFromHash();
            setupEventListeners();
            renderApp();
            fetchCatalog();
            fetchApplications();
        };
    </script>
</body>
</html>
