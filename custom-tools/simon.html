<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="homescreen-tool" content='{
  "version": 1,
  "title": "Simón NEO",
  "icon": "disc",
  "width": 340,
  "height": 380,
  "minWidth": 260,
  "minHeight": 260,
  "supportsPip": false
}'>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    background-color: #0f1115;
    color: #f3f4f6;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    padding: 12px;
  }
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #9ca3af;
  }
  .score-board {
    display: flex;
    gap: 16px;
  }
  .score-item span {
    color: #a855f7;
    font-weight: 700;
  }
  .game-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: rgba(20, 24, 33, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    overflow: hidden;
    padding: 12px;
  }
  .simon-board {
    display: grid;
    grid-template-columns: repeat(2, 110px);
    grid-template-rows: repeat(2, 110px);
    gap: 10px;
    position: relative;
  }
  .pad {
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: filter 0.1s, transform 0.05s;
    opacity: 0.5;
  }
  .pad:active {
    transform: scale(0.97);
  }
  .pad.active {
    opacity: 1 !important;
  }
  .pad-green { background-color: #22c55e; }
  .pad-red { background-color: #ef4444; }
  .pad-yellow { background-color: #eab308; }
  .pad-blue { background-color: #3b82f6; }

  .pad-green.active { box-shadow: 0 0 15px #22c55e; }
  .pad-red.active { box-shadow: 0 0 15px #ef4444; }
  .pad-yellow.active { box-shadow: 0 0 15px #eab308; }
  .pad-blue.active { box-shadow: 0 0 15px #3b82f6; }

  .center-hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 68px;
    height: 68px;
    background: #090a0f;
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    cursor: pointer;
    user-select: none;
  }
  .center-hub span {
    font-size: 10px;
    font-weight: 700;
    color: #9ca3af;
    letter-spacing: 0.5px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 21, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    text-align: center;
    padding: 16px;
  }
  .overlay.hidden {
    display: none;
  }
  .overlay h2 {
    font-size: 18px;
    color: #f3f4f6;
    letter-spacing: 0.5px;
  }
  .overlay p {
    font-size: 12px;
    color: #9ca3af;
  }
  .btn {
    background: #a855f7;
    color: #090a0f;
    border: none;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover {
    background: #9333ea;
    color: #ffffff;
  }
  .btn:active {
    transform: scale(0.96);
  }
</style>
</head>
<body>

  <div class="app-header">
    <div class="score-board">
      <div class="score-item">NIVEL: <span id="score">0</span></div>
      <div class="score-item">RÉCORD: <span id="highscore">0</span></div>
    </div>
  </div>

  <div class="game-container">
    <div class="simon-board">
      <div class="pad pad-green" data-color="0" id="pad0"></div>
      <div class="pad pad-red" data-color="1" id="pad1"></div>
      <div class="pad pad-yellow" data-color="2" id="pad2"></div>
      <div class="pad pad-blue" data-color="3" id="pad3"></div>
      
      <div class="center-hub" id="centerBtn">
        <span id="centerText">JUGAR</span>
      </div>
    </div>

    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">SIMÓN NEO</h2>
      <p id="overlayDesc">Memoriza y repite la secuencia de luces</p>
      <button class="btn" id="startBtn">COMENZAR</button>
    </div>
  </div>

<script>
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayDesc = document.getElementById('overlayDesc');
  const startBtn = document.getElementById('startBtn');
  const centerBtn = document.getElementById('centerBtn');
  const centerText = document.getElementById('centerText');
  const pads = [
    document.getElementById('pad0'),
    document.getElementById('pad1'),
    document.getElementById('pad2'),
    document.getElementById('pad3')
  ];

  let sequence = [];
  let playerSequence = [];
  let score = 0;
  let highscore = 0;
  let gamePlaying = false;
  let canPlay = false;

  // Audio Context sintético local (sin recursos externos)
  let audioCtx = null;
  function playTone(index) {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      const frequencies = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
      osc.frequency.value = frequencies[index];
      osc.type = 'sine';

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } catch(e) {
      // Audio desactivado si no hay interacción previa o soporte
    }
  }

  async function loadHighScore() {
    try {
      if (window.hs && window.hs.storage) {
        const saved = await window.hs.storage.get('simon_highscore');
        if (saved !== undefined && saved !== null) {
          highscore = parseInt(saved, 10) || 0;
        }
      } else {
        const saved = localStorage.getItem('simon_highscore');
        if (saved) highscore = parseInt(saved, 10);
      }
    } catch(e) {
      console.error(e);
    }
    highscoreEl.textContent = highscore;
  }

  async function saveHighScore() {
    try {
      if (window.hs && window.hs.storage) {
        await window.hs.storage.set('simon_highscore', highscore);
      } else {
        localStorage.setItem('simon_highscore', highscore);
      }
    } catch(e) {
      console.error(e);
    }
  }

  loadHighScore();

  function startGame() {
    sequence = [];
    playerSequence = [];
    score = 0;
    scoreEl.textContent = score;
    overlay.classList.add('hidden');
    gamePlaying = true;
    centerText.textContent = "ESPERA";
    nextRound();
  }

  function nextRound() {
    playerSequence = [];
    canPlay = false;
    score++;
    scoreEl.textContent = score;
    if (score - 1 > highscore) {
      highscore = score - 1;
      highscoreEl.textContent = highscore;
      saveHighScore();
    }

    const randomPad = Math.floor(Math.random() * 4);
    sequence.push(randomPad);
    playSequence();
  }

  function playSequence() {
    let i = 0;
    centerText.textContent = "MEMORIZA";
    const interval = setInterval(() => {
      if (i >= sequence.length) {
        clearInterval(interval);
        canPlay = true;
        centerText.textContent = "TURNO";
        return;
      }
      const padIndex = sequence[i];
      flashPad(padIndex);
      i++;
    }, 600);
  }

  function flashPad(index) {
    const pad = pads[index];
    pad.classList.add('active');
    playTone(index);
    setTimeout(() => {
      pad.classList.remove('active');
    }, 300);
  }

  function handlePadClick(index) {
    if (!gamePlaying || !canPlay) return;

    flashPad(index);
    playerSequence.push(index);

    const currentIndex = playerSequence.length - 1;
    if (playerSequence[currentIndex] !== sequence[currentIndex]) {
      gameOver();
      return;
    }

    if (playerSequence.length === sequence.length) {
      canPlay = false;
      setTimeout(nextRound, 1000);
    }
  }

  function gameOver() {
    gamePlaying = false;
    canPlay = false;
    centerText.textContent = "JUGAR";
    
    if (score - 1 > highscore) {
      highscore = score - 1;
      highscoreEl.textContent = highscore;
      saveHighScore();
    }

    overlayTitle.textContent = "¡FALLASTE!";
    overlayDesc.textContent = `Nivel alcanzado: ${score - 1}`;
    startBtn.textContent = "REINTENTAR";
    overlay.classList.remove('hidden');

    if (window.hs && typeof window.hs.notify === 'function') {
      window.hs.notify(`Game Over! Nivel: ${score - 1}`);
    }
  }

  pads.forEach(pad => {
    const colorIndex = parseInt(pad.getAttribute('data-color'), 10);
    pad.addEventListener('click', () => handlePadClick(colorIndex));
    pad.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePadClick(colorIndex);
    });
  });

  startBtn.addEventListener('click', startGame);
  centerBtn.addEventListener('click', () => {
    if (!gamePlaying) startGame();
  });
</script>
</body>
</html>
