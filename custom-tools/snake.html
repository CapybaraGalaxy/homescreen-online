<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="homescreen-tool" content='{
  "version": 1,
  "title": "Snake",
  "icon": "gamepad-2",
  "width": 340,
  "height": 400,
  "minWidth": 260,
  "minHeight": 260,
  "supportsPip": false
}'>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    background-color: #0f1115;
    color: #f3f4f6;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    padding: 12px;
  }
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #9ca3af;
  }
  .score-board {
    display: flex;
    gap: 12px;
  }
  .score-item span {
    color: #22c55e;
    font-weight: 700;
  }
  .game-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: rgba(20, 24, 33, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    overflow: hidden;
    padding: 8px;
  }
  canvas {
    background: #090a0f;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 21, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    text-align: center;
    padding: 16px;
  }
  .overlay.hidden {
    display: none;
  }
  .overlay h2 {
    font-size: 18px;
    color: #f3f4f6;
    letter-spacing: 0.5px;
  }
  .overlay p {
    font-size: 12px;
    color: #9ca3af;
  }
  .btn {
    background: #22c55e;
    color: #090a0f;
    border: none;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover {
    background: #16a34a;
  }
  .btn:active {
    transform: scale(0.96);
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(2, 36px);
    gap: 6px;
    margin-top: 10px;
    justify-content: center;
  }
  .ctrl-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #f3f4f6;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .ctrl-btn:hover {
    background: rgba(255, 255, 255, 0.12);
  }
  .ctrl-btn:active {
    background: rgba(255, 255, 255, 0.2);
  }
  .ctrl-up { grid-column: 2; grid-row: 1; }
  .ctrl-left { grid-column: 1; grid-row: 2; }
  .ctrl-down { grid-column: 2; grid-row: 2; }
  .ctrl-right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

  <div class="app-header">
    <div class="score-board">
      <div class="score-item">PUNTOS: <span id="score">0</span></div>
      <div class="score-item">RÉCORD: <span id="highscore">0</span></div>
    </div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="280" height="280"></canvas>
    
    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">SNAKE NEO</h2>
      <p id="overlayDesc">Usa las flechas o los botones táctiles</p>
      <button class="btn" id="startBtn">INICIAR JUEGO</button>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn ctrl-up" id="btnUp">▲</button>
    <button class="ctrl-btn ctrl-left" id="btnLeft">◀</button>
    <button class="ctrl-btn ctrl-down" id="btnDown">▼</button>
    <button class="ctrl-btn ctrl-right" id="btnRight">▶</button>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayDesc = document.getElementById('overlayDesc');
  const startBtn = document.getElementById('startBtn');

  const gridSize = 14;
  const tileCount = 20; // 20 * 14 = 280px

  let snake = [];
  let food = { x: 0, y: 0 };
  let dx = 0;
  let dy = 0;
  let score = 0;
  let highscore = 0;
  let gameInterval = null;
  let gameRunning = false;
  let changingDirection = false;

  // Carga de récord persistente usando Homescreen NEO Bridge o localStorage
  async function loadHighScore() {
    try {
      if (window.hs && window.hs.storage) {
        const saved = await window.hs.storage.get('snake_highscore');
        if (saved !== undefined && saved !== null) {
          highscore = parseInt(saved, 10) || 0;
        }
      } else {
        const saved = localStorage.getItem('snake_highscore');
        if (saved) highscore = parseInt(saved, 10);
      }
    } catch(e) {
      console.error(e);
    }
    highscoreEl.textContent = highscore;
  }

  async function saveHighScore() {
    try {
      if (window.hs && window.hs.storage) {
        await window.hs.storage.set('snake_highscore', highscore);
      } else {
        localStorage.setItem('snake_highscore', highscore);
      }
    } catch(e) {
      console.error(e);
    }
  }

  loadHighScore();

  function resetGame() {
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];
    dx = 1;
    dy = 0;
    score = 0;
    scoreEl.textContent = score;
    spawnFood();
  }

  function spawnFood() {
    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
    // Evitar que la comida aparezca sobre la serpiente
    snake.forEach(part => {
      if (part.x === food.x && part.y === food.y) {
        spawnFood();
      }
    });
  }

  function startGame() {
    resetGame();
    overlay.classList.add('hidden');
    gameRunning = true;
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, 110);
  }

  function gameLoop() {
    changingDirection = false;
    update();
    if (checkGameOver()) {
      endGame();
      return;
    }
    draw();
  }

  function update() {
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    snake.unshift(head);
    
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > highscore) {
        highscore = score;
        highscoreEl.textContent = highscore;
        saveHighScore();
      }
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function checkGameOver() {
    const head = snake[0];
    // Colisión con paredes
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
      return true;
    }
    // Colisión consigo misma
    for (let i = 1; i < snake.length; i++) {
      if (head.x === snake[i].x && head.y === snake[i].y) {
        return true;
      }
    }
    return false;
  }

  function endGame() {
    clearInterval(gameInterval);
    gameRunning = false;
    overlayTitle.textContent = "¡JUEGO TERMINADO!";
    overlayDesc.textContent = `Puntuación final: ${score}`;
    startBtn.textContent = "JUGAR DE NUEVO";
    overlay.classList.remove('hidden');
    
    // Notificación opcional mediante la API de Homescreen NEO
    if (window.hs && typeof window.hs.notify === 'function') {
      window.hs.notify(`Game Over! Puntuación: ${score}`);
    }
  }

  function draw() {
    // Limpiar canvas
    ctx.fillStyle = '#090a0f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dibujar comida
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.roundRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2, 3);
    ctx.fill();

    // Dibujar serpiente
    snake.forEach((part, index) => {
      ctx.fillStyle = index === 0 ? '#22c55e' : '#10b981';
      ctx.beginPath();
      ctx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2, 3);
      ctx.fill();
    });
  }

  function changeDirection(newDx, newDy) {
    if (changingDirection) return;
    // Evitar giros de 180 grados instantáneos
    if (newDx !== 0 && dx !== 0) return;
    if (newDy !== 0 && dy !== 0) return;
    
    dx = newDx;
    dy = newDy;
    changingDirection = true;
  }

  // Controles de teclado
  document.addEventListener('keydown', e => {
    if (!gameRunning) return;
    switch(e.key) {
      case 'ArrowUp':
      case 'w':
      case 'W':
        changeDirection(0, -1);
        break;
      case 'ArrowDown':
      case 's':
      case 'S':
        changeDirection(0, 1);
        break;
      case 'ArrowLeft':
      case 'a':
      case 'A':
        changeDirection(-1, 0);
        break;
      case 'ArrowRight':
      case 'd':
      case 'D':
        changeDirection(1, 0);
        break;
    }
  });

  // Controles táctiles en pantalla
  document.getElementById('btnUp').addEventListener('click', () => { if(gameRunning) changeDirection(0, -1); });
  document.getElementById('btnDown').addEventListener('click', () => { if(gameRunning) changeDirection(0, 1); });
  document.getElementById('btnLeft').addEventListener('click', () => { if(gameRunning) changeDirection(-1, 0); });
  document.getElementById('btnRight').addEventListener('click', () => { if(gameRunning) changeDirection(1, 0); });

  startBtn.addEventListener('click', startGame);

  // Renderizado inicial estático
  resetGame();
  draw();
</script>
</body>
</html>
